# claude-drafted: 2026-10-18 — 이재엽 결정 "GitHub Action + API 토큰": main에 올라오면 CHANGELOG.md 맨 위 버전을 Jira 릴리스로 만들고,
# 이번 push의 커밋 메시지에 적힌 Jira 키의 이슈에 그 버전을 붙인다. 설정(비밀값 3개 · 변수 1개)과 이유: 01-docs/00-overview/jira.md 3절.
# 비밀값이 없으면 건너뛰고 성공으로 끝난다. 시험: 04-tests/repo/jira-release.test.js
# 2026-10-19(이재엽 결정, 인수인계 4절 제안 1번): 그 전에 changes/*.md 조각을 CHANGELOG.md 맨 위 다음 번호로 합쳐 main에 커밋한다
# (.github/scripts/changelog-fold.js, 시험 04-tests/repo/changelog-fold.test.js). GITHUB_TOKEN으로 한 push는 워크플로를 다시 깨우지 않아 되풀이되지 않는다.
# main 끝(ref: main)을 받는다 — 병합이 잇달아도 concurrency가 줄을 세우고, 뒤 실행이 앞 실행의 합친 커밋 위에서 돈다.
name: jira-release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jira-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 200   # changelog-fold.js가 지난 병합 커밋에서 PR 번호를 찾는다
      - name: changes/*.md 조각 → CHANGELOG.md 다음 번호
        run: node .github/scripts/changelog-fold.js
      - name: 합친 CHANGELOG를 main에 커밋
        run: |
          if git diff --quiet -- CHANGELOG.md changes; then echo "합칠 조각 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md changes
          git commit -m "chore(changelog): 조각을 버전 기록에 합침 — $(git diff --cached --name-only -- changes | sed 's#changes/##; s#\.md$##' | paste -sd ' ' -)"
          git push origin HEAD:main
      - name: CHANGELOG 맨 위 버전 → Jira 릴리스
        run: node .github/scripts/jira-release.js
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
