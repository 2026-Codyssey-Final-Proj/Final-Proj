<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 5분 스토리보드</title>
<!-- claude-drafted: 2026-10-20 — 두승현의 요청("첫 5분 흐름을 스토리보드로 … 초안", 같은 날 "실제 화면처럼 하나 하나 목업으로 보이는 방식으로 — 지금은 한 곳에 정보량이 많음")으로 Claude가 만든 그림판.
     한 장면씩 실제 화면처럼 크게 보인다. 글은 onboarding-storyboard.md와 같다(어긋나면 .md가 맞다).
     서버 · AI를 부르지 않고 아무것도 저장하지 않는다. 플로로는 02-frontend/navigator/seal.js · seal.css를 그대로 불러온다(제품의 플로로가 바뀌면 같이 바뀐다).
     섬 · 레벨 오버레이 모양은 game-overlay/level-overlay.html의 색을 따랐다 — 제품 화면을 그대로 옮긴 것이 아니라 장면을 보여 주는 목업이다. Jira KAN-55. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../02-frontend/navigator/seal.css">
<style>
:root {
  --bg: #05081F; --panel: #0B1138;
  --ink: #F2F6FF; --ink2: #D6E0F5; --mute: #9DAED6;
  --ice: #A9DDFF; --ice-hi: #E6F6FF; --ice-ink: #0E1A4F; --ice-soft: rgba(169, 221, 255, .16);
  --fill: rgba(255, 255, 255, .07); --fill2: rgba(255, 255, 255, .12); --line: rgba(255, 255, 255, .15);
  --night: rgba(8, 12, 44, .86); --gold: #FFD27A; --ok: #8FE3B0; --new: #FF9DB8; --part: #FFD27A; --warn: #FFB37A;
  --ui: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
body { min-height: 100vh; display: flex; flex-direction: column; }
button { font-family: var(--ui); }
a { color: var(--ice); }

/* ── 위 막대: 제목 · 장면 점 · 넘기기 ── */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px 10px; max-width: 1240px; width: 100%; margin: 0 auto; }
.bar h1 { font-size: 17px; margin: 0; white-space: nowrap; }
.bar h1 small { color: var(--mute); font-weight: 500; font-size: 12px; margin-left: 6px; }
.dots { display: flex; gap: 6px; flex: 1; justify-content: center; min-width: 0; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--mute); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; }
.dot.seen { border-color: var(--ice); color: var(--ice); }
.dot.on { background: var(--ice); border-color: var(--ice); color: var(--ice-ink); }
.dot.star { border-color: var(--gold); color: var(--gold); }
.dot.star.on { background: var(--gold); color: var(--ice-ink); }
.nav { display: flex; gap: 6px; }
.nb { border-radius: 999px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); padding: 6px 14px; font-size: 14px; cursor: pointer; }
.nb.pri { background: var(--ice); color: var(--ice-ink); border-color: var(--ice); font-weight: 700; }
.nb:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ── 무대: 실제 화면 크기(1200 × 750)로 그리고 창 폭에 맞춰 줄인다 ── */
.stage { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 16px; flex: 1; }
.fit { position: relative; width: 100%; }
.desk { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; transform-origin: 0 0; border-radius: 14px; overflow: hidden;
  background: #0E1330; box-shadow: 0 24px 60px rgba(0, 0, 0, .5), 0 0 0 1px var(--line); }

/* 뒤의 코딩 도구 — 흐리게. 섬이 주인공이다 */
.ide { position: absolute; inset: 0; display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 34px 1fr 190px; opacity: .55; }
.ide-top { grid-column: 1 / 3; background: #0A0F28; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.ide-top i { width: 11px; height: 11px; border-radius: 50%; background: #3A4370; display: inline-block; }
.ide-tab { margin-left: 18px; font: 12px var(--mono); color: #8C97C4; background: #141B42; padding: 6px 12px; border-radius: 6px 6px 0 0; }
.ide-side { background: #0B1030; border-right: 1px solid rgba(255,255,255,.06); padding: 14px 12px; font: 12px/2 var(--mono); color: #6E7AAB; }
.ide-code { padding: 18px 22px; font: 13px/1.85 var(--mono); color: #7F8BBE; white-space: pre; overflow: hidden; }
.ide-code .k { color: #B39DFF; } .ide-code .s { color: #8FE3B0; } .ide-code .c { color: #4D5788; } .ide-code .f { color: #7FC8FF; }
.ide-term { grid-column: 2 / 3; background: #080C24; border-top: 1px solid rgba(255,255,255,.08); padding: 12px 18px; font: 12.5px/1.8 var(--mono); color: #7F8BBE; white-space: pre; }
.ide-term b { color: #C8D2F5; font-weight: 500; }

/* 섬 — 화면 위쪽 가운데 */
.island { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 2; background: var(--night); border: 1px solid var(--line);
  backdrop-filter: blur(8px); box-shadow: 0 18px 50px rgba(0, 0, 0, .55); color: var(--ink); transition: width .5s cubic-bezier(.2,.8,.2,1), height .5s, border-radius .5s; }
.island.band { width: 230px; height: 30px; border-radius: 999px; display: grid; place-items: center; }
.island.open { width: 600px; border-radius: 30px; padding: 18px 22px 20px; }
.island.wide { width: 700px; border-radius: 26px; padding: 22px 26px 24px; top: 40px; }
.wave { width: 170px; height: 12px; }
.wave path { fill: none; stroke: var(--ice); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.2s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.i-top { display: flex; align-items: center; gap: 10px; }
.lv { font-weight: 800; color: var(--gold); font-size: 15px; letter-spacing: .02em; }
.i-title { font-weight: 700; font-size: 16px; }
.exp { display: flex; align-items: center; gap: 10px; margin-top: 9px; font-size: 12.5px; color: var(--mute); }
.exp-bar { flex: 1; height: 9px; border-radius: 5px; background: var(--fill2); overflow: hidden; }
.exp-bar span { display: block; height: 100%; width: var(--from, 0%); background: linear-gradient(90deg, var(--ice), var(--gold)); border-radius: 5px; animation: fill 1.1s .5s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes fill { to { width: var(--to); } }
.exp-plus { color: var(--gold); font-weight: 800; font-size: 15px; opacity: 0; animation: plus 1.6s 1.1s ease-out forwards; }
@keyframes plus { 0% { opacity: 0; transform: translateY(6px); } 25% { opacity: 1; transform: none; } 100% { opacity: 1; } }

.i-main { display: flex; gap: 14px; align-items: flex-start; margin-top: 14px; }
.pet { flex: none; width: 104px; height: 104px; display: grid; place-items: end center; }
.pet.pop { animation: pop .7s .2s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes pop { from { transform: translateY(36px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.says { display: grid; gap: 8px; flex: 1; min-width: 0; padding-top: 6px; }
.say { background: var(--ice-hi); color: var(--ice-ink); border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 16px; line-height: 1.45; font-weight: 600; justify-self: start;
  opacity: 0; animation: say .4s ease forwards; }
.say:nth-child(2) { animation-delay: .9s; }
@keyframes say { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.box { margin-top: 14px; background: var(--fill); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14.5px; color: var(--ink2); }
.todo { display: flex; gap: 10px; align-items: center; }
.ck { width: 19px; height: 19px; flex: none; border-radius: 6px; border: 2px solid var(--mute); display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--ice-ink); }
.ck.ok { background: var(--ok); border-color: var(--ok); animation: tick .4s 1s both; }
@keyframes tick { from { transform: scale(.4); } to { transform: none; } }
.todo.now span:last-child { color: var(--ink); font-weight: 700; }
.term { font-size: 11px; color: var(--mute); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; margin-left: 6px; }
.label { font-size: 12px; color: var(--mute); }
.input { background: #F4F7FF; color: var(--ice-ink); border-radius: 14px; padding: 12px 14px; font-size: 16px; font-weight: 600; min-height: 48px; }
.input .ph { color: #8A95BD; font-weight: 500; }
.caret { display: inline-block; width: 2px; height: 18px; background: var(--ice-ink); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
/* 짜임(두승현 2026-10-20) — 플로로 줄(플로로 + 옆의 말, 같은 높이) 아래로 내용 → 단추 → 안내를 섬 폭 그대로 쌓는다.
   층: ① 상태(LV · EXP, 아래 옅은 선) ② 플로로의 말 ③ 내용 카드 ④ 행동(주 단추 하나, 맨 앞) ⑤ 안내(작은 글). 간격은 8(층 안) · 14(층 사이) · 20(가장자리) */
.island.open, .island.wide { display: grid; grid-template-columns: 140px minmax(0, 1fr); column-gap: 18px; align-content: start; }
.island.open > *, .island.wide > * { grid-column: 1 / -1; }   /* 플로로 줄 아래(내용 · 단추 · 안내)는 섬 폭을 다 쓴다 — 플로로 밑이 비지 않게(두승현 2026-10-20) */
.island .i-top, .island .exp, .island .carry { grid-column: 1 / -1; }
.island .i-main { display: contents; }
/* 플로로는 옆의 말(말풍선 · 제목)과 같은 줄, 같은 세로 크기로(두승현 2026-10-20, CouCou처럼 — 마스코트와 글의 높이를 맞춘다). 크기는 render()의 fitPets가 말의 높이로 정한다 */
.island .i-main > .pet { grid-column: 1; align-self: start; justify-self: end; }
.island .i-main > .says, .island .i-main > .w-head { grid-column: 2; padding-top: 0; align-self: center; }
.island .exp { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.w-head .w-title { margin-top: 4px; }
.b { font-size: 14.5px; border-radius: 999px; padding: 9px 18px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); white-space: nowrap; }
.b.pri { background: var(--ice); color: var(--ice-ink); border-color: var(--ice); font-weight: 700; }
.b.soft { background: transparent; color: var(--mute); border-style: dashed; }
.b.off { opacity: .4; }
.b kbd { font: 11px var(--ui); opacity: .6; margin-left: 6px; }
.ifine { margin-top: 10px; font-size: 12.5px; color: var(--mute); }
.carry { background: rgba(255, 210, 122, .12); border: 1px solid rgba(255, 210, 122, .45); color: var(--gold); border-radius: 12px; padding: 9px 13px; font-size: 14px; margin-bottom: 14px; }
.w-title { font-size: 21px; font-weight: 800; margin: 0; }
.w-sub { color: var(--ink2); font-size: 14.5px; margin: 6px 0 0; }
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: center; font-size: 15px; color: var(--ink2); }
.steps .dotc { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--mute); display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--ice-ink); flex: none; }
.steps .ok .dotc { background: var(--ok); border-color: var(--ok); }
.steps .doing .dotc { border-color: var(--ice); box-shadow: 0 0 0 5px var(--ice-soft); }
.steps .doing { color: var(--ink); font-weight: 700; }
.steps small { color: var(--mute); font-weight: 400; margin-left: 6px; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pick { background: var(--fill); border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; font-size: 13.5px; color: var(--ink2); }
.pick b { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 3px; }
.pick.rec { border-color: var(--ice); box-shadow: 0 0 0 1px var(--ice) inset; }
.rec-t { font-size: 11px; color: var(--ice-ink); background: var(--ice); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.preview { margin-top: 14px; border: 1.5px dashed var(--ice); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; color: var(--ice-hi); background: var(--ice-soft); display: grid; gap: 6px; }
.preview b { color: var(--ice); font-size: 12.5px; }
.map { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 14px; }
.map span { height: 54px; border-radius: 12px; background: var(--fill); border: 1px solid var(--line); display: grid; place-items: center; text-align: center; font-size: 11.5px; color: var(--mute); padding: 4px; line-height: 1.25; }
.map span b { display: block; color: var(--ink2); font-size: 14px; }
.map span.q { animation: q 2s ease-in-out infinite; }
@keyframes q { 50% { border-color: var(--ice); color: var(--ice); } }
.home4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.home4 span { background: var(--fill); border: 1px solid var(--line); border-radius: 16px; padding: 13px 4px; text-align: center; font-size: 14.5px; font-weight: 600; }
.home4 kbd { display: block; font: 11px var(--ui); color: var(--mute); margin-top: 2px; }
.shelf { margin-top: 14px; display: flex; gap: 12px; align-items: center; font-size: 14.5px; color: var(--ink2); background: var(--fill); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.book { width: 30px; height: 44px; border-radius: 4px 7px 7px 4px; background: linear-gradient(180deg, #8EA2FF, #5A6BE0); box-shadow: inset -4px 0 0 rgba(0, 0, 0, .22); flex: none; animation: slide .6s 1s both; }
@keyframes slide { from { transform: translateY(-14px) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.warnbox { margin-top: 14px; border: 1.5px solid var(--warn); background: rgba(255, 179, 122, .1); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; color: #FFD9BD; }
.chip { display: inline-block; font-size: 12.5px; border-radius: 999px; padding: 3px 10px; border: 1px solid var(--warn); color: var(--warn); margin-top: 6px; }
.fixture { display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--ice-ink); background: var(--gold); border-radius: 999px; padding: 1px 8px; margin-left: 8px; }
.spark { position: absolute; z-index: 3; color: var(--gold); font-size: 22px; opacity: 0; animation: twinkle 1.8s ease-in-out infinite; pointer-events: none; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.15); } }
.hello-say { position: absolute; z-index: 2; left: calc(50% + 10px); top: 92px; }
.hello-pet { position: absolute; z-index: 2; left: calc(50% - 130px); top: 56px; }

/* ── 아래 한 줄 설명 ── */
.cap { max-width: 1240px; width: 100%; margin: 0 auto; padding: 14px 16px 22px; }
.cap-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cap-id { color: var(--ice); font-weight: 800; font-size: 15px; }
.cap-id.star { color: var(--gold); }
.cap-id.br { color: var(--new); }
.cap-name { font-weight: 800; font-size: 19px; }
.cap-time { color: var(--mute); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.cap-feel { color: var(--ink2); font-size: 15px; flex-basis: 100%; margin-top: 2px; }
.cap-feel b { color: var(--ink); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; color: var(--ice-ink); }
.tag.have { background: var(--ok); } .tag.part { background: var(--part); } .tag.new { background: var(--new); }
.cap-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.brc { border-radius: 999px; border: 1px dashed var(--new); background: transparent; color: var(--new); font-size: 13px; padding: 5px 12px; cursor: pointer; }
.brc.back { border-style: solid; border-color: var(--line); color: var(--ink2); }
details { margin-top: 10px; color: var(--ink2); font-size: 14px; }
summary { cursor: pointer; color: var(--mute); font-size: 13px; }
.det { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; margin-top: 8px; }
.det b { color: var(--mute); font-weight: 600; font-size: 12.5px; }
.foot { max-width: 1240px; width: 100%; margin: 0 auto; padding: 0 16px 26px; color: var(--mute); font-size: 12.5px; }

@media (max-width: 640px) { .bar h1 small { display: none; } .dot { width: 26px; height: 26px; font-size: 11px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="bar">
  <h1>첫 5분 스토리보드<small>초안 · 2026-10-20 · KAN-55</small></h1>
  <div class="dots" id="dots" role="tablist" aria-label="장면"></div>
  <div class="nav">
    <button class="nb" id="prev" type="button" aria-label="이전 장면">‹ 이전</button>
    <button class="nb pri" id="next" type="button" aria-label="다음 장면">다음 ›</button>
    <button class="nb" id="play" type="button" aria-label="자동으로 넘기기">▶</button>
  </div>
</header>

<main class="stage"><div class="fit" id="fit"><div class="desk" id="desk"></div></div></main>

<section class="cap" aria-live="polite">
  <div class="cap-main"><span class="cap-id" id="capId"></span><span class="cap-name" id="capName"></span><span id="capTag"></span><span class="cap-time" id="capTime"></span>
    <span class="cap-feel" id="capFeel"></span></div>
  <div class="cap-row" id="capRow"></div>
  <details id="det"><summary>자세히 — 사용자가 하는 일 · 지금 코드</summary><div class="det" id="detBody"></div></details>
</section>
<p class="foot">← → 키로 넘긴다. 글은 <a href="onboarding-storyboard.md">onboarding-storyboard.md</a>와 같다(어긋나면 .md가 맞다). 지금 앱(9.0.0)은 이 순서가 아니다 — 바꿀 모습을 그린 목업이다. 서버 · AI 없음, 아무것도 저장하지 않는다.</p>

<script src="../../02-frontend/navigator/seal.js"></script>
<script>
(() => {
  "use strict";
  const Seal = window.NavSeal;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pet = (mood, size = 140, pop) => `<div class="pet${pop ? " pop" : ""}" style="width:${size}px;height:${size}px">${Seal ? Seal.svg(mood, size, { hole: true }) : ""}</div>`;
  const LINE = "동아리 행사 신청을 받는 앱을 만들고 싶어요";
  const QUOTE = LINE.slice(0, 16) + "…";
  const TODOS = ["어떤 불편을 풀고 싶은지 한 문장으로 쓰기", "다 만들면 무엇이 달라지는지 쓰기", "누가 쓰는지 쓰기", "얼마나 크게 만들지 정하기"];   // navigator.js STAGES[0]
  const STAGE_NAMES = ["정하기", "적어 두기", "기능 정리", "방법 고르기", "뼈대", "만들기", "재 보기", "돌아보기"];               // navigator.js STAGES[].short

  // 조각
  const says = (arr) => `<div class="says">${arr.map((t) => `<div class="say">${esc(t)}</div>`).join("")}</div>`;

      p.style.marginTop = `${-Math.round(k * TOP)}px`;
      // 맨 위 줄이면(LV · EXP 줄이 없는 장면) 끌어올린 그림 상자의 머리 위 표시(생각 방울 등)가 섬 테두리를 넘지 않게 위 여백을 그만큼 둔다
      if (!m.previousElementSibling) m.parentElement.style.paddingTop = `${Math.round(k * TOP) + 6}px`;
      const svg = p.querySelector("svg"); if (svg) { svg.setAttribute("width", k); svg.setAttribute("height", k); }
    });
  }
  const deskScale = () => { const m = /scale\(([\d.]+)\)/.exec($("desk").style.transform || ""); return m ? Number(m[1]) : 1; };

  function render() {
    clearInterval(typeTimer);
    const s = branch ? BRANCHES[branch] : SCENES[cur];
    $("desk").innerHTML = IDE + s.view();
    fitPets();
    if (s.after) s.after();
    const id = branch || s.id;
    $("capId").textContent = id + (s.star ? " ★" : "");
    $("capId").className = `cap-id${s.star ? " star" : ""}${branch ? " br" : ""}`;
    $("capName").textContent = branch ? `갈래 · ${s.name}` : s.name;
    $("capTag").innerHTML = `<span class="tag ${s.impl}" title="${TIP[s.impl]}">${TAG[s.impl]}</span>`;
    $("capTime").textContent = branch ? `${SCENES[s.from].id}에서 갈라짐` : s.t;
    $("capFeel").innerHTML = s.feel;
    $("capRow").innerHTML = branch
      ? `<button class="brc back" type="button" data-back="1">‹ ${SCENES[s.from].id} ${esc(SCENES[s.from].name)}로 돌아가기</button>`
      : (s.branches || []).map((b) => `<button class="brc" type="button" data-br="${b}">갈래 ${b} · ${esc(BRANCHES[b].name)} 보기</button>`).join("");
    $("detBody").innerHTML = `<b>사용자</b><span>${esc(s.act)}</span><b>지금 코드</b><span><span class="tag ${s.impl}">${TAG[s.impl]}</span> ${esc(s.how)}</span>`;
    const at = branch ? s.from : cur;
    document.querySelectorAll(".dot").forEach((d, k) => { d.classList.toggle("on", k === at); d.classList.toggle("seen", k < at); d.setAttribute("aria-selected", k === at); });
    $("prev").disabled = !branch && cur === 0;
    $("next").disabled = !branch && cur === SCENES.length - 1;
    try { history.replaceState(null, "", `#${id}`); } catch {}
  }
  function go(i) { branch = null; cur = Math.max(0, Math.min(SCENES.length - 1, i)); render(); }
  function stop() { clearInterval(timer); timer = null; $("play").textContent = "▶"; }

  $("dots").innerHTML = SCENES.map((s, i) => `<button class="dot${s.star ? " star" : ""}" type="button" role="tab" data-i="${i}" title="${s.id} ${esc(s.name)} · ${s.t}" aria-label="${s.id} ${esc(s.name)}">${i}</button>`).join("");
  $("dots").addEventListener("click", (e) => { const d = e.target.closest(".dot"); if (d) { stop(); go(Number(d.dataset.i)); } });
  $("prev").addEventListener("click", () => { stop(); branch ? go(BRANCHES[branch].from) : go(cur - 1); });
  $("next").addEventListener("click", () => { stop(); branch ? go(BRANCHES[branch].from + 1) : go(cur + 1); });
  $("play").addEventListener("click", () => {
    if (timer) return stop();
    if (branch || cur === SCENES.length - 1) go(0);
    $("play").textContent = "❚❚";
    timer = setInterval(() => { if (cur >= SCENES.length - 1) return stop(); go(cur + 1); }, 5000);
  });
  $("capRow").addEventListener("click", (e) => {
    const b = e.target.closest("[data-br]"), back = e.target.closest("[data-back]");
    if (b) { stop(); branch = b.dataset.br; render(); }
    if (back) { stop(); go(BRANCHES[branch].from); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("summary")) return;
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("prev").click();
  });

  // 무대 맞추기 — 1200 × 750으로 그리고 폭에 맞춰 줄인다
  function fit() {
    const w = $("fit").clientWidth, k = Math.min(1, w / 1200);
    $("desk").style.transform = `scale(${k})`;
    $("fit").style.height = `${750 * k}px`;
  }
  addEventListener("resize", fit);
  fit();

  // 주소 끝(#S3, #B2)으로 바로 연다
  const h = location.hash.slice(1);
  if (BRANCHES[h]) { branch = h; render(); }
  else { const i = SCENES.findIndex((s) => s.id === h); go(i >= 0 ? i : 0); }
})();
</script>
</body>
</html>
