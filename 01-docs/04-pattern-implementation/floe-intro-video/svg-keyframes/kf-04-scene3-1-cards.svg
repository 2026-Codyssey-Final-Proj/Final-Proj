    <text data-caption="3" x="6" y="66" font-size="7.2" fill="#16226A">③ 관문 · 이해하셨나요?</text>
    
  </g></g><g transform="translate(5.61 -3.9) rotate(-0.38 219 49) translate(219 49) scale(1.01) translate(-219 -49)"><g data-quad="2" opacity="1" transform="translate(164 12)">
    <rect x=".5" y=".5" width="109" height="73" rx="6" fill="#FFFFFF" stroke="#D5E2F3"/>
    <rect x=".5" y=".5" width="109" height="4" rx="2" fill="#14B8A6"/>
    <rect x="6" y="10" width="98" height="22" rx="3" fill="#F5F8FD" stroke="#D5E2F3"/>
    <rect x="11" y="13.7" width="0" height="2.6" rx="1.3" fill="#9FB4D6"/>
