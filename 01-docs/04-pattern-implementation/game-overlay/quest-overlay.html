<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀘스트 오버레이 목업</title>
<!-- claude-drafted: 2026-10-21 — 이재엽 요청("게임처럼 다가가기 쉽게 … 7개의 과정이 도전과제로 이어지고 … 플로로와 대화하면서 퀘스트를 받고 수행 … 오버레이의 오른쪽에서 정보를 더 … LV/EXP는 지우고 진행 줄은 맨 위에만 … 홈과 바이브 코딩 UI를 하나로").
     화면 시안일 뿐 — 서버 · AI · 저장 없음. 플로로의 말 · Claude Code 알림은 정해 둔 글이다. 플로로는 seal.js · seal.css를 그대로 불러온다(제품의 플로로가 바뀌면 목업도 같이 바뀐다).
     할 일 문구는 03-backend/navigator/navigator.js의 2단계에서 옮겼다. 스토리보드: quest-storyboard.md -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../../02-frontend/navigator/seal.css">
<style>
:root {
  --ink: #F2F6FF; --ink2: #D6E0F5; --mute: #9DAED6;
  --ice: #A9DDFF; --ice-hi: #E6F6FF; --ice-ink: #0E1A4F; --ice-soft: rgba(169, 221, 255, .16);
  --fill: rgba(255, 255, 255, .07); --fill2: rgba(255, 255, 255, .11); --line: rgba(255, 255, 255, .14);
  --gold: #FFD98A; --gold-soft: rgba(255, 217, 138, .18); --ok: #6FD3A6;
  --ui: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 15px/1.6 var(--ui); color: var(--ink2); background-color: #091142; min-height: 100vh;
  background: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent) fixed, radial-gradient(1px 1px at 31% 8%, #DDE8FF, transparent) fixed,
    radial-gradient(1.5px 1.5px at 47% 27%, #fff, transparent) fixed, radial-gradient(1px 1px at 78% 22%, #fff, transparent) fixed,
    linear-gradient(105deg, transparent 30%, rgba(140, 190, 255, .10) 36%, transparent 44%) fixed,
    linear-gradient(180deg, #0B1550, #091142 60%, #060B33) fixed; }
button { font: inherit; color: inherit; cursor: pointer; }
.note { max-width: 980px; margin: 18px auto 0; padding: 0 20px; font-size: 13px; color: var(--mute); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.note b { color: var(--ice); }
.note button { background: var(--fill); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }

/* ── 섬 — 위 줄 하나(늘 같다) + 왼쪽 대화 + 오른쪽 정보 ── */
.isl { width: min(980px, calc(100% - 32px)); margin: 14px auto 40px; border-radius: 28px; background: #1A2766; box-shadow: 0 24px 60px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(255, 255, 255, .08); overflow: hidden; }
.tb { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; }
.tb .home { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill2); display: grid; place-items: center; }
.tb .home svg { width: 18px; height: 18px; stroke: var(--ice); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb .brand { font-weight: 800; color: var(--ink); font-size: 16px; }
.tb .prog { margin-left: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); flex-wrap: wrap; }
.tb .prog b { color: var(--ice); }
.tb .dots { display: inline-flex; gap: 4px; }
.tb .dots i { width: 18px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .18); }
.tb .dots i.on { background: var(--ice); }
.tb .dots i.done { background: var(--gold); }
.tb .right { margin-left: auto; display: flex; gap: 6px; }
.tb .ti { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--mute); display: grid; place-items: center; }
.tb .ti svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.tb .ti.on { background: var(--fill2); color: var(--ice); }
.body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; padding: 4px 14px 14px; }

/* 왼쪽 — 플로로와 대화 */
.chat { display: flex; flex-direction: column; gap: 10px; border-radius: 20px; background: rgba(0, 0, 0, .18); padding: 12px; min-height: 440px; }
.chat .head { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 12.5px; }
.chat .head svg.cat { width: 44px; height: 44px; }
.log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; max-height: 360px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg .b { padding: 9px 13px; border-radius: 16px 16px 16px 4px; background: var(--fill2); color: var(--ink); font-size: 14px; line-height: 1.5; }
.msg.me .b { background: var(--ice); color: var(--ice-ink); border-radius: 16px 16px 4px 16px; font-weight: 600; }
.msg.sys .b { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(255, 217, 138, .35); font-size: 13px; border-radius: 12px; }
.msg svg.cat { width: 30px; height: 30px; flex: none; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 38px; }
.opts button { border: 1.5px solid var(--ice); background: transparent; color: var(--ice-hi); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; }
.opts button:hover { background: var(--ice-soft); }
.opts button.pri { background: var(--ice); color: var(--ice-ink); }
.input { display: flex; gap: 8px; align-items: center; border: 1.5px dashed var(--line); border-radius: 16px; padding: 8px 10px 8px 14px; color: var(--mute); font-size: 13.5px; }
.input input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; }
.input .send { border: 0; border-radius: 999px; background: var(--fill2); padding: 6px 12px; font-size: 13px; color: var(--ink); }

/* 오른쪽 — 퀘스트 · 도전과제 · 서고 */
.side { display: flex; flex-direction: column; gap: 10px; }
.seg { display: flex; gap: 4px; background: rgba(0, 0, 0, .18); border-radius: 999px; padding: 4px; width: fit-content; }
.seg button { border: 0; background: transparent; color: var(--mute); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--fill2); color: var(--ice); }
.pane { display: none; } .pane.on { display: block; }
/* 퀘스트 카드 — 제목 띠 · 요약 · 설명 · 단추 넷 */
.qcard { border-radius: 18px; overflow: hidden; border: 1.5px solid var(--line); background: rgba(0, 0, 0, .14); }
.qhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; background: linear-gradient(135deg, #2A4AC8, #1E3BA6); color: #fff; align-items: center; }
.qhead .k { font-size: 12px; opacity: .85; }
.qhead h3 { margin: 2px 0 0; font-size: 17px; line-height: 1.3; }
.qhead svg.cat { width: 64px; height: 64px; }
.qbody { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.qbody .k { font-size: 12px; font-weight: 800; color: var(--ice); }
.obj { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.obj li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.obj .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--fill2); font-size: 14px; flex: none; }
.obj .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--mute); }
.obj li.done { color: var(--ok); } .obj li.done .n { color: var(--ok); }
.qdesc { font-size: 13.5px; color: var(--ink2); line-height: 1.6; margin: 0; }
.qacts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.qacts button { border: 1.5px solid var(--line); background: var(--fill); color: var(--ink); border-radius: 12px; padding: 8px 4px; font-size: 12.5px; font-weight: 700; }
.qacts button.pri { background: var(--ice); color: var(--ice-ink); border-color: transparent; }
.qacts button:disabled { opacity: .4; cursor: not-allowed; }
.reward { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); padding: 0 4px; }
.reward .piece { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(255, 217, 138, .35); font-weight: 700; }
.reward .piece.got { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.6); } }
.today { display: grid; gap: 6px; }
.today button { text-align: left; border: 1.5px solid var(--line); background: var(--fill); border-radius: 14px; padding: 10px 12px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
.today small { color: var(--mute); display: block; }
.today .tag { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--ice-soft); color: var(--ice); font-weight: 800; white-space: nowrap; }
.today .tag.side { background: var(--gold-soft); color: var(--gold); }
/* 도전과제 나무 — 장마다 한 줄, 주 퀘스트는 왼쪽에서 오른쪽으로, 곁 퀘스트는 아래 가지 */
.tree { border-radius: 18px; border: 1.5px solid var(--line); background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 22px), rgba(0, 0, 0, .14); padding: 10px 12px; max-height: 420px; overflow: auto; }
.chap { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.chap:last-child { border-bottom: 0; }
.chap .no { font-size: 12px; font-weight: 800; color: var(--mute); padding-top: 8px; line-height: 1.3; }
.chap .no b { display: block; font-size: 15px; color: var(--ink); }
.chap.done .no b { color: var(--gold); } .chap.cur .no b { color: var(--ice); }
.row { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
.node { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--fill); display: grid; place-items: center; font-size: 18px; position: relative; cursor: pointer; flex: none; }
.node::after { content: ""; position: absolute; left: 100%; top: 50%; width: 14px; height: 2px; background: var(--line); }
.row > .node:last-of-type::after, .row > .branch:last-child .node::after { display: none; }
.node.done { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 10px rgba(255, 217, 138, .35); }
.node.cur { border-color: var(--ice); background: var(--ice-soft); box-shadow: 0 0 0 3px rgba(169, 221, 255, .25); animation: pulse 1.6s ease-in-out infinite; }
.node.lock { opacity: .4; filter: grayscale(1); }
.node.gate { border-radius: 50%; border-style: double; border-width: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(169, 221, 255, .12); } }
.gap { width: 14px; height: 2px; background: var(--line); flex: none; }
.branch { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-left: 14px; }
.branch .node { width: 32px; height: 32px; border-radius: 50%; font-size: 14px; }
.branch .node::after { display: none; }
.branch small { font-size: 10px; color: var(--mute); white-space: nowrap; }
.tree .tip { font-size: 12px; color: var(--mute); margin: 0 0 6px; }
.detail { margin-top: 8px; font-size: 13px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 8px; min-height: 36px; }
/* 서고 */
.lib { display: grid; gap: 8px; }
.lib .book { border-radius: 14px; border: 1.5px solid var(--line); padding: 10px 12px; background: var(--fill); font-size: 13.5px; }
.lib .book b { display: block; color: var(--ink); }
.stamps { display: flex; gap: 6px; margin-top: 6px; }
.stamps i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 10px; font-style: normal; color: var(--mute); }
.stamps i.on { border-color: var(--gold); color: var(--gold); }
@media (max-width: 760px) { .body { grid-template-columns: 1fr; } .tb .prog { display: none; } }
</style>
</head>
<body>
<p class="note"><b>목업</b> 서버 · AI 없음 — 단추를 누르면 정해 둔 대로 흘러가요. 스토리보드: <code>quest-storyboard.md</code>
  <button type="button" id="reset">처음부터</button><button type="button" id="alert">Claude Code에서 일한 것처럼 알림 보내기</button></p>

<div class="isl" id="isl">
  <!-- 위 줄 — 홈이든 바이브 코딩이든 늘 같다: 집 · Floe · 진행 줄(여기에만) · 설정 · 핀 · 접기 -->
  <div class="tb">
    <button class="home" type="button" id="home" title="홈"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></button>
    <span class="brand">Floe</span>
    <span class="prog"><b id="p-chap">2장 · 꼭 필요한 기능 정리하기</b><span id="p-q">퀘스트 1/5</span><span class="dots" id="p-dots"></span></span>
    <span class="right">
      <button class="ti" type="button" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
      <button class="ti on" type="button" title="열어 두기"><svg viewBox="0 0 24 24"><path d="M12 17v5M8 7l1 7h6l1-7M6 7h12M9 3h6v4H9z"/></svg></button>
      <button class="ti" type="button" title="접기"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    </span>
  </div>
  <div class="body">
    <!-- 왼쪽 — 플로로와 대화 -->
    <section class="chat" aria-label="플로로와 대화">
      <div class="head"><span id="cat-head"></span><span>플로로 · 2장을 같이 하고 있어요 · 파일을 놓으면 먹이로 받아요</span></div>
      <div class="log" id="log"></div>
      <div class="opts" id="opts"></div>
      <div class="input"><input id="say" placeholder="플로로에게 말하기 — 예) 회원 신청 화면이 있어야 해요"><button class="send" type="button" id="send">보내기</button></div>
    </section>
    <!-- 오른쪽 — 퀘스트 · 도전과제 · 서고 -->
    <section class="side" aria-label="정보">
      <div class="seg" role="tablist">
        <button type="button" role="tab" data-tab="quest" aria-selected="true">퀘스트</button>
        <button type="button" role="tab" data-tab="tree" aria-selected="false">도전과제</button>
        <button type="button" role="tab" data-tab="lib" aria-selected="false">서고</button>
      </div>
      <div class="pane on" id="pane-quest"></div>
      <div class="pane" id="pane-tree"></div>
      <div class="pane" id="pane-lib"></div>
    </section>
  </div>
</div>

<script src="../../../02-frontend/navigator/seal.js"></script>
<script>
(() => {
  const S = window.NavSeal, $ = (id) => document.getElementById(id);
  const cat = (mood, size, opts) => S.svg(mood, size, opts);
  // 2장(navigator.js STAGES[2])의 할 일 — 주 퀘스트 셋 · 곁 퀘스트 둘. 이름은 그대로, 모양만 퀘스트
  const CHAPTERS = [
    { n: 0, name: "출발", main: ["불편 한 문장", "달라지는 것", "누가 쓰나", "얼마나 크게"], side: [], state: "done" },
    { n: 1, name: "적어 두기", main: ["빈칸 채우기", "왜 · 어디까지 · 언제", "한 문장 한 가지"], side: ["기획서로 키우기", "보안 한 줄"], state: "done" },
    { n: 2, name: "기능 정리", main: ["'~하면, 앱은 ~한다'로 쓰기", "애매한 말 숫자로", "꼭 · 있으면 좋음 표시"], side: ["출처 표 잇기(5개 이상)", "막아야 할 일 쓰기"], state: "cur" },
    { n: 3, name: "방법 고르기", main: ["선택지 셋", "장단점", "하나 고르기"], side: ["그림 하나로"], state: "lock" },
    { n: 4, name: "뼈대", main: ["작은 할 일로", "차례 정하기"], side: ["위험한 일 먼저"], state: "lock" },
    { n: 5, name: "만들기", main: ["할 일 하나씩", "Claude Code에 넘기기", "허락 · 거절"], side: ["시험 먼저", "느낀 점"], state: "lock" },
    { n: 6, name: "써 보기", main: ["직접 써 보기", "잰 값 적기", "못 한 것 적기"], side: ["남에게 보여 주기"], state: "lock" },
    { n: 7, name: "돌아보기", main: ["잘된 것 · 안 된 것", "다음엔 뺄 것"], side: ["책장 고르기"], state: "lock" },
  ];
  const ICON = ["📝", "🗂️", "📋", "🧭", "🦴", "🛠️", "🧪", "📖"];
  const QUEST = { title: "기능을 '~하면, 앱은 ~한다' 문장으로 쓰기", chap: 2, giver: "플로로가 줌",
    objs: [["📋", "기능 문장", 3], ["🔢", "애매한 말 숫자로", 1]],
    desc: "회원이 무엇을 하면 앱이 무엇을 하는지, 한 줄에 한 가지씩이요. '빠르게' 같은 말이 나오면 숫자로 바꿔 봐요(모르면 '아직 모름'도 돼요). 다 되면 플로로에게 완료 보고!",
    reward: ["🧩 조각 '기능 목록' ×1", "▮ 책갈피 +1"] };
  const EXAMPLES = ["회원이 신청 단추를 누르면, 앱은 신청서를 보여 준다", "운영진이 승인하면, 앱은 신청자에게 바로 알린다", "마감 하루 전이 되면, 앱은 신청자에게 알림을 보낸다"];
  const st = { tab: "quest", home: true, got: [0, 0], done: false, piece: false };

  // ── 대화 ──
  const log = $("log"), opts = $("opts");
  function msg(who, text) {
    const d = document.createElement("div"); d.className = `msg ${who}`;
    d.innerHTML = `${who === "floro" ? cat("look", 30) : ""}<span class="b">${text}</span>`;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function choices(list) {
    opts.innerHTML = list.map(([label, act, pri]) => `<button type="button" data-act="${act}"${pri ? ' class="pri"' : ""}>${label}</button>`).join("");
  }
  const ACT = {
    start() { st.home = false; renderProg(); msg("me", "퀘스트 할게요"); msg("floro", "<b>기능을 '~하면, 앱은 ~한다' 문장으로 쓰기</b> — 3개면 돼요. 오른쪽에 퀘스트 카드를 뒀어요. 첫 기능을 말해 주세요!"); choices([["예시 보여 줘", "example"], ["직접 쓸게요", "own"]]); renderQuest(); },
    example() { msg("me", "예시 보여 줘"); msg("floro", `이렇게요 — "${EXAMPLES[st.got[0]]}". 이 문장으로 적을까요?`); choices([["네, 적을게요", "accept", true], ["고칠게요", "own"]]); },
    own() { msg("floro", "아래 칸에 적어 주세요. 제가 '~하면, 앱은 ~한다'로 다듬어 볼게요"); choices([]); $("say").focus(); },
    accept() {
      msg("me", "네, 적을게요"); st.got[0] = Math.min(3, st.got[0] + 1); renderQuest();
      if (st.got[0] < 3) { msg("floro", `좋아요, ${st.got[0]}개 됐어요. 다음 기능은요?`); choices([["예시 보여 줘", "example"], ["직접 쓸게요", "own"]]); }
      else { msg("floro", "3개 다 됐어요! '빠르게'처럼 애매한 말은 없나요? 없으면 완료 보고할까요?"); choices([["완료 보고", "report", true], ["숫자로 바꿀 게 있어요", "number"]]); }
    },
    number() { msg("me", "숫자로 바꿀 게 있어요"); msg("floro", "'빠르게'는 몇 초 안이면 될까요? 모르면 '아직 모름'도 돼요"); choices([["3초 안", "num3", true], ["10초 안", "num10"], ["아직 모름", "numx"]]); },
    num3() { msg("me", "3초 안"); st.got[1] = 1; renderQuest(); msg("floro", "→ '3초 안'으로 정했어요. 완료 보고할까요?"); choices([["완료 보고", "report", true]]); },
    num10() { ACT.num3(); }, numx() { msg("me", "아직 모름"); st.got[1] = 1; renderQuest(); msg("floro", "'아직 모름'으로 적어 뒀어요 — 나중에 정하면 돼요. 완료 보고할까요?"); choices([["완료 보고", "report", true]]); },
    report() { if (st.done) return; st.done = true; st.piece = true; msg("me", "완료 보고"); msg("floro", "퀘스트 완료! 🧩 조각 '기능 목록'을 받았어요. 기능이 5개가 넘으면 '출처 표 잇기'도 해 볼 수 있어요 — 안 해도 돼요."); choices([["다음 퀘스트 받기", "next", true], ["곁 퀘스트 볼래요", "tree"]]); renderQuest(); renderTree(); },
    next() { msg("me", "다음 퀘스트 받기"); msg("floro", "다음은 <b>기능마다 꼭 필요한지, 있으면 좋은지 표시하기</b>예요. 받을래요?"); choices([["받을게요", "start2", true], ["나중에", "later"]]); },
    start2() { msg("me", "받을게요"); msg("floro", "(목업은 여기까지예요 — 흐름은 스토리보드 S3~S6과 같아요)"); choices([]); },
    later() { msg("me", "나중에"); msg("floro", "그럼 쉬어요. 다시 오면 여기서 이어서 해요"); choices([["퀘스트 하기", "start", true]]); },
    tree() { setTab("tree"); msg("floro", "오른쪽에 도전과제 나무를 펼쳤어요. 금빛은 끝낸 것, 파란 빛은 지금이에요"); choices([["다음 퀘스트 받기", "next", true]]); },
    feed() { msg("me", "먹이 주기"); msg("floro", "글 파일(.md · .txt)을 섬에 놓거나 글을 붙여 넣어 주세요 — 구간으로 나눠 정리해 드려요"); choices([["퀘스트 하기", "start", true]]); },
    lib() { setTab("lib"); msg("floro", "오른쪽에 서고를 열었어요 — 내 책과 받은 먹이가 있어요"); choices([["퀘스트 하기", "start", true]]); },
    reflect() { msg("me", "반영"); st.got[0] = Math.min(3, st.got[0] + 1); renderQuest(); msg("floro", `Claude Code가 만든 것을 보고 기능 문장 하나를 더 채웠어요(${st.got[0]}/3)`); choices(st.got[0] < 3 ? [["예시 보여 줘", "example"], ["직접 쓸게요", "own"]] : [["완료 보고", "report", true]]); },
    ignore() { msg("me", "나중에"); choices([["예시 보여 줘", "example"], ["직접 쓸게요", "own"]]); },
  };
  opts.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](); });
  function send() {
    const t = $("say").value.trim(); if (!t) return; $("say").value = "";
    msg("me", t);
    if (st.home) { msg("floro", "좋아요 — 그건 퀘스트에서 같이 적어요. 먼저 퀘스트를 받을까요?"); choices([["퀘스트 하기", "start", true]]); return; }
    const lower = t.replace(/\s+/g, "");
    const made = t.includes("하면") ? t : `${t.replace(/[.。]$/, "")}이(가) 있으면, 앱은 그 화면을 보여 준다`;
    msg("floro", `"${made}" — 이렇게 적을까요?`); choices([["네, 적을게요", "accept", true], ["고칠게요", "own"]]);
    void lower;
  }
  $("send").onclick = send; $("say").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  $("alert").onclick = () => { msg("sys", "Claude Code가 작업을 마쳤어요 — 신청서.html을 만들었어요. 퀘스트에 반영할까요?"); if (!st.home && !st.done) choices([["반영", "reflect", true], ["나중에", "ignore"]]); };

  // ── 오른쪽 판 ──
  function setTab(tab) { st.tab = tab; document.querySelectorAll("[role=tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab))); document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === `pane-${tab}`)); }
  document.querySelectorAll("[role=tab]").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
  function renderProg() {
    $("p-chap").textContent = st.home ? "홈 · 2장에서 이어서" : "2장 · 꼭 필요한 기능 정리하기";
    $("p-q").textContent = st.home ? "오늘 퀘스트 3개" : `퀘스트 ${st.done ? 2 : 1}/5`;
    $("p-dots").innerHTML = [0, 1, 2, 3, 4].map((i) => `<i class="${i === 0 && st.done ? "done" : i === (st.done ? 1 : 0) && !st.home ? "on" : ""}"></i>`).join("");
  }
  function renderQuest() {
    const q = QUEST, p = $("pane-quest");
    if (st.home) {
      p.innerHTML = `<div class="qcard"><div class="qhead"><div><div class="k">오늘의 퀘스트 · 2장</div><h3>무엇부터 할까요?</h3></div>${cat("happy", 64, { hole: true })}</div>
        <div class="qbody"><div class="today">
          <button type="button" data-act="start"><span>📋</span><span><b>기능을 '~하면, 앱은 ~한다'로 쓰기</b><small>주 퀘스트 · 3개</small></span><span class="tag">주</span></button>
          <button type="button" data-act="feed"><span>🐟</span><span><b>플로로에게 먹이 주기</b><small>파일을 놓거나 글을 붙여 넣기</small></span><span class="tag side">언제든</span></button>
          <button type="button" data-act="tree"><span>🗺️</span><span><b>도전과제 나무 보기</b><small>8장 중 2장까지 왔어요</small></span><span class="tag side">보기</span></button>
        </div></div></div>`;
      p.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => ACT[b.dataset.act]()));
      return;
    }
    const total = q.objs.reduce((n, o) => n + o[2], 0), got = st.got.reduce((n, g) => n + g, 0);
    p.innerHTML = `<div class="qcard"><div class="qhead"><div><div class="k">${q.chap}장 · ${q.giver}</div><h3>${q.title}</h3></div>${cat(st.done ? "done" : "look", 64, { hole: true })}</div>
      <div class="qbody"><div class="k">퀘스트 요약 ${got}/${total}</div><ul class="obj">${q.objs.map((o, i) => `<li class="${st.got[i] >= o[2] ? "done" : ""}"><span class="ic">${o[0]}</span>${o[1]}<span class="n">${st.got[i]} / ${o[2]}</span></li>`).join("")}</ul>
      <p class="qdesc">${q.desc}</p>
      <div class="reward"><span>보상</span>${q.reward.map((r) => `<span class="piece${st.piece ? " got" : ""}">${r}</span>`).join("")}</div>
      <div class="qacts"><button type="button" class="pri" data-act="report" ${got < total || st.done ? "disabled" : ""}>완료 보고</button><button type="button" data-act="hint">힌트</button><button type="button" data-act="later">나중에</button><button type="button" data-act="skip">넘기기</button></div></div></div>`;
    p.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => {
      if (b.dataset.act === "hint") { msg("floro", "힌트: '누가 — 무엇을 하면 — 앱은 — 무엇을 한다' 네 조각이에요. 예시를 보여 드릴까요?"); choices([["예시 보여 줘", "example", true]]); return; }
      if (b.dataset.act === "skip") { msg("floro", "이 퀘스트는 주 퀘스트라 넘길 수 없어요 — 곁 퀘스트만 넘길 수 있어요"); return; }
      ACT[b.dataset.act]();
    }));
  }
  function renderTree() {
    const p = $("pane-tree");
    const node = (label, cls, icon) => `<span class="node ${cls}" title="${label}" data-label="${label}">${icon}</span>`;
    p.innerHTML = `<div class="tree"><p class="tip">8장 · 금빛 = 끝냄 · 파란 빛 = 지금 · 흐림 = 아직. 누르면 아래에 설명이 떠요 — 차례를 건너뛰지는 못해요</p>${CHAPTERS.map((c) => {
      const cls = (i) => c.state === "done" ? "done" : c.state === "lock" ? "lock" : (c.n === 2 && st.done && i === 0) ? "done" : (c.n === 2 && i === (st.done ? 1 : 0)) ? "cur" : "lock";
      return `<div class="chap ${c.state}"><div class="no"><b>${c.n}장</b>${c.name}</div><div class="row">${c.main.map((m, i) => node(m, cls(i), ICON[c.n])).join('<span class="gap"></span>')}<span class="gap"></span>${node("관문 — 이해되셨나요?", `gate ${c.state === "done" ? "done" : "lock"}`, "⛩")}${c.side.map((s) => `<span class="branch">${node(s, c.state === "done" ? "done" : "lock", "✦")}<small>${s}</small></span>`).join("")}</div></div>`;
    }).join("")}<div class="detail" id="detail">퀘스트를 누르면 무엇을 하는지, 보상이 무엇인지 보여요.</div></div>`;
    p.querySelectorAll(".node").forEach((n) => (n.onclick = () => { $("detail").innerHTML = `<b>${n.dataset.label}</b> — ${n.classList.contains("done") ? "끝냈어요 · 조각을 받았어요 🧩" : n.classList.contains("cur") ? "지금 하는 퀘스트예요 — 왼쪽에서 플로로와 같이 해요" : n.classList.contains("gate") ? "관문 — 이 장의 주 퀘스트를 다 하면 플로로가 '이해되셨나요?'를 물어요" : "아직 열리지 않았어요 — 앞의 퀘스트를 먼저 해요"}`; }));
  }
  function renderLib() {
    $("pane-lib").innerHTML = `<div class="lib"><div class="book"><b>동아리 행사 등록 앱 · 내 책</b>지금 2장 · 정한 것 3 · 받은 먹이 1 · 확인할 먹이 0<div class="stamps">${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<i class="${i < 2 ? "on" : ""}">${i}</i>`).join("")}</div></div>
      <div class="book"><b>서고</b>끝낸 책 5권 · 책장 2개('분류 안 함' · '알림') — 7장을 지나면 이 책이 꽂혀요</div></div>`;
  }
  function reset() {
    Object.assign(st, { tab: "quest", home: true, got: [0, 0], done: false, piece: false });
    log.innerHTML = ""; setTab("quest"); renderProg(); renderQuest(); renderTree(); renderLib();
    msg("floro", "안녕하세요! 2장 <b>꼭 필요한 기능 정리하기</b>를 하고 있었죠. 오늘은 무엇부터 할까요?");
    choices([["퀘스트 하기", "start", true], ["먹이 주기", "feed"], ["서고", "lib"]]);
  }
  $("cat-head").innerHTML = cat("idle", 44);
  $("reset").onclick = reset; $("home").onclick = reset;
  reset();
})();
</script>
</body>
</html>
