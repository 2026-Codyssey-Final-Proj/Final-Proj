<!doctype html>
<!-- claude-drafted: 2026-10-17 — 이재엽의 요청("책갈피 지식 그래프를 원신의 운명의 자리처럼")으로 Claude가 만든 시안. 가상 데이터, 서버·Neo4j 없음.
     원신의 그림은 쓰지 않았고 원리(윤곽 문장 · 꼭짓점 별 · 하나씩 켜지는 별)만 가져왔다. 윤곽 그림 3개는 자리표시이고, 실제 그림은 와이어 담당이 그린다.
     데이터 모양은 library-constellation-plan-2026-10-17.md 5-1절의 fixture 계약과 같다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책갈피 지도 시안</title>
<style>
  :root {
    --sky-1: #04131c; --sky-2: #0a2a36; --nebula: #1d5f6e;
    --line: #6fd6d9; --outline: rgba(111, 214, 217, .35);
    --text: #e8f6f8; --muted: #a9c9cf; --panel: rgba(8, 30, 40, .86); --border: rgba(111, 214, 217, .35);
    --star: #fff6dc; --glow: #ffd98a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 30% 20%, var(--sky-2), var(--sky-1) 70%); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tabs button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: rgba(111, 214, 217, .18); border-color: var(--line); }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 32px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .sky { position: relative; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
    background: radial-gradient(circle at 60% 55%, rgba(29, 95, 110, .55), transparent 60%), radial-gradient(circle at 25% 80%, rgba(29, 95, 110, .35), transparent 50%); }
  svg { width: 100%; height: 100%; display: block; }
  .outline { fill: none; stroke: var(--outline); stroke-width: .45; stroke-linejoin: round; stroke-linecap: round; }
  .link { stroke: var(--line); stroke-width: .35; opacity: .8; }
  .star { cursor: pointer; outline: none; }
  .star text { font-size: 2.3px; fill: var(--muted); }
  .star:focus-visible circle.core, .star.sel circle.core { stroke: var(--line); stroke-width: .5; }
  aside { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; align-self: start; }
  aside h2 { font-size: 16px; margin: 0 0 8px; }
  aside .line { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 12px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .cite { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(111, 214, 217, .15); color: var(--text); font: inherit; cursor: pointer; }
  .legend { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--star); display: inline-block; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; text-align: center; padding: 24px; }
  .note { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>책갈피 지도</h1>
  <p>책마다 꽂아 둔 책갈피가 별이 되고, 이해할수록 밝아져요. (시안 · 가상 데이터)</p>
  <div class="tabs" role="group" aria-label="책 고르기" id="tabs"></div>
</header>
<main>
  <div class="sky" id="sky">
    <svg viewBox="0 0 100 100" role="img" aria-label="책갈피 별자리" id="svg">
      <defs>
        <radialGradient id="halo"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="dust"></g><g id="outline"></g><g id="links"></g><g id="stars"></g>
    </svg>
  </div>
  <aside aria-live="polite" id="card"></aside>
</main>
<p class="note">시안: 서버·Neo4j 없이 fixture JSON으로 그린다. 같은 모양을 Neo4j 질의가 돌려준다(계획 문서 5-1절). 윤곽 그림은 자리표시 — 실제 그림은 와이어 담당이 그린다.</p>

<script>
// fixture — Neo4j 질의 결과와 같은 모양 (book · stars · links)
const BOOKS = [
  { book: { id: "b1", title: "로그인 만들기", emblem: "key" },
    stars: [
      { id: "m1", title: "세션과 토큰의 차이", line: "서버가 기억하느냐, 클라이언트가 들고 다니느냐", level: 3, cited: 4, x: 24, y: 28 },
      { id: "m2", title: "비밀번호는 해시로", line: "원문 대신 되돌릴 수 없는 값만 저장", level: 2, cited: 2, x: 40, y: 44 },
      { id: "m3", title: "401과 403", line: "누구인지 모름 / 알지만 권한 없음", level: 1, cited: 1, x: 58, y: 56 },
      { id: "m4", title: "환경변수에 키 두기", line: "코드·저장소에 키를 쓰지 않는다", level: 2, cited: 1, x: 72, y: 68 },
      { id: "m5", title: "로그인 실패 횟수 제한", line: "막을 때도 이유를 정직하게", level: 0, cited: 0, x: 80, y: 82 },
      { id: "m6", title: "OAuth로 빌려 쓰기", line: "로그인을 직접 만들지 않는 길", level: 0, cited: 0, x: 66, y: 84 },
    ],
    links: [["m1","m2"],["m2","m3"],["m3","m4"],["m4","m5"],["m4","m6"]] },
  { book: { id: "b2", title: "할 일 알림", emblem: "compass" },
    stars: [
      { id: "n1", title: "마감 3일·1일·당일", line: "알림 시점을 숫자로 정한다", level: 3, cited: 3, x: 50, y: 18 },
      { id: "n2", title: "실패하면 알린다", line: "조용히 멈추지 않는다", level: 2, cited: 2, x: 78, y: 46 },
      { id: "n3", title: "재시도 1·2·4초", line: "상한을 넘으면 멈추고 알림", level: 1, cited: 0, x: 62, y: 78 },
      { id: "n4", title: "실행 기록 한 줄", line: "언제·무엇을·성공/실패", level: 1, cited: 1, x: 34, y: 78 },
      { id: "n5", title: "캘린더엔 제목만", line: "본문은 밖으로 보내지 않는다", level: 2, cited: 1, x: 22, y: 46 },
    ],
    links: [["n1","n2"],["n2","n3"],["n3","n4"],["n4","n5"],["n5","n1"]] },
  { book: { id: "b3", title: "아직 빈 책", emblem: "book" }, stars: [], links: [] },
];

// 윤곽 그림 — 자리표시(우리가 그린 단순 도형). 실제 그림은 와이어 담당이 그린다
const EMBLEMS = {
  key: "M18 30 a12 12 0 1 1 24 0 a12 12 0 1 1 -24 0 M30 30 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 M38 38 L84 84 M70 70 l-6 6 M78 78 l-6 6 M14 52 Q8 70 22 88 Q46 98 70 92",
  compass: "M50 10 a40 40 0 1 1 -0.1 0 M50 22 L58 50 L50 78 L42 50 Z M22 50 L78 50 M50 10 L50 4 M86 50 L92 50",
  book: "M14 24 Q32 16 50 24 Q68 16 86 24 L86 80 Q68 72 50 80 Q32 72 14 80 Z M50 24 L50 80 M60 20 L60 40 L64 36 L68 40 L68 20",
};
const LEVELS = ["처음 봄", "이해함", "직접 씀", "응용함"];
const ns = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };

// 배경 먼지별 — 고정 시드라 매번 같은 하늘
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 90; i++) el("circle", { cx: rnd() * 100, cy: rnd() * 100, r: rnd() * .25 + .05, fill: rnd() > .85 ? "#9fe3ff" : "#cfe9ee", opacity: rnd() * .6 + .2 }, $("dust"));

let current = 0, selected = null;
function render() {
  const data = BOOKS[current];
  for (const g of ["outline", "links", "stars"]) $(g).replaceChildren();
  document.querySelector(".empty")?.remove();
  el("path", { d: EMBLEMS[data.book.emblem] || "", class: "outline" }, $("outline"));
  if (!data.stars.length) {
    const d = document.createElement("div"); d.className = "empty";
    d.textContent = "아직 꽂은 책갈피가 없어요. 책에서 기억하고 싶은 곳에 책갈피를 꽂으면 첫 별이 떠요.";
    $("sky").appendChild(d); showCard(null); return;
  }
  const byId = Object.fromEntries(data.stars.map((s) => [s.id, s]));
  for (const [a, b] of data.links) { const s = byId[a], t = byId[b]; if (s && t) el("line", { x1: s.x, y1: s.y, x2: t.x, y2: t.y, class: "link" }, $("links")); }
  for (const s of data.stars) {
    const g = el("g", { class: "star", tabindex: 0, role: "button", "aria-label": `${s.title}, ${LEVELS[s.level]}` }, $("stars"));
    const bright = [.35, .6, .85, 1][s.level];
    if (s.cited > 0) el("circle", { cx: s.x, cy: s.y, r: 2.2 + s.level * .8, fill: "url(#halo)", opacity: bright * .8 }, g);
    el("circle", { class: "core", cx: s.x, cy: s.y, r: .8 + s.level * .35, fill: "#fff6dc", opacity: bright }, g);
    if (s.level >= 2) el("path", { d: `M${s.x - 2.6} ${s.y} L${s.x + 2.6} ${s.y} M${s.x} ${s.y - 2.6} L${s.x} ${s.y + 2.6}`, stroke: "#fff6dc", "stroke-width": .18, opacity: bright }, g);
    const label = el("text", { x: s.x + 2.4, y: s.y - 1.6 }, g); label.textContent = LEVELS[s.level];
    const pick = () => { selected = s.id; showCard(s); document.querySelectorAll(".star").forEach((n) => n.classList.toggle("sel", n === g)); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  }
  showCard(data.stars.find((s) => s.id === selected) || null);
}
function showCard(s) {
  const card = $("card"), book = BOOKS[current].book;
  if (!s) {
    card.innerHTML = `<h2>${book.title}</h2><p class="line">별을 누르면 책갈피 내용이 보여요. 밝을수록 더 깊이 이해한 지식이에요.</p>` + legend();
    return;
  }
  card.innerHTML = `<h2>${s.title}</h2><p class="line">${s.line}</p>
    <dl><dt>이해 수준</dt><dd>${LEVELS[s.level]}</dd><dt>쓰인 횟수</dt><dd>${s.cited}번</dd><dt>책</dt><dd>${book.title}</dd></dl>
    <button class="cite" type="button" id="cite">이 단계에 쓰기</button>` + legend();
  $("cite").onclick = () => { s.cited += 1; render(); };   // 시안: 화면 안에서만 +1 (실제로는 CITED_IN 관계가 생긴다)
}
const legend = () => `<div class="legend">${LEVELS.map((l, i) => `<span><i style="opacity:${[.35,.6,.85,1][i]}"></i>${l}</span>`).join("")}</div>`;
BOOKS.forEach((b, i) => {
  const btn = document.createElement("button"); btn.type = "button"; btn.textContent = `${b.book.title} · 별 ${b.stars.length}`;
  btn.setAttribute("aria-pressed", String(i === current));
  btn.onclick = () => { current = i; selected = null; document.querySelectorAll(".tabs button").forEach((x, j) => x.setAttribute("aria-pressed", String(j === i))); render(); };
  $("tabs").appendChild(btn);
});
render();
</script>
</body>
</html>
