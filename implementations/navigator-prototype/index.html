<!doctype html>
<!-- claude-drafted: 2026-10-14 — Navigator 프로토타입 화면. 규칙은 navigator.js, 연습 예시는 scenario.js, 실제 Claude 호출은 server.js.
     접힘·펼침·시작 인사·답을 기다릴 때 고정·진행 세 줄은 CouCou의 동작을 따랐다(코드·캐릭터·소리는 가져오지 않음).
     화면 글은 비개발자용 쉬운 말 — 전문 용어는 작은 "용어" 표시로만 보인다(navigator.test.js가 확인). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigator 프로토타입</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1d1d1b;--mute:#615f58;--line:#e2e0d8;--ok:#0f6e56;--okbg:#e1f5ee;--warn:#8a5a00;--warnbg:#fff3d6;--bad:#a32d2d;--badbg:#fdeaea;--acc:#534ab7;--accbg:#eeedfe;--term:#24231f;--termink:#d9d7cc}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe4;--mute:#a3a198;--line:#34332e;--ok:#5dcaa5;--okbg:#10332a;--warn:#f0b955;--warnbg:#3a2d10;--bad:#f09595;--badbg:#3d1c1c;--acc:#afa9ec;--accbg:#26243d;--term:#0f0f0d;--termink:#c9c7bc}}
:root{color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
/* 뒤쪽: 사용자의 AI 코딩 도구 자리 (예시) */
.tool{max-width:960px;margin:84px auto 40px;padding:0 16px}
.tool .label{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:6px;flex-wrap:wrap}
.term{background:var(--term);color:var(--termink);border-radius:10px;padding:16px;font:13px/1.7 ui-monospace,Consolas,monospace;min-height:320px;white-space:pre-wrap}
.term .me{color:#8fb8ff}.term .dim{opacity:.6}
/* 앞쪽: 옆자리 동료 */
.nav{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 32px));z-index:10;display:flex;flex-direction:column;align-items:center}
.strip{width:120px;height:22px;display:flex;align-items:flex-start;justify-content:center;background:none;border:0;padding:0}
.strip i{display:block;width:96px;height:6px;border-radius:99px;background:var(--mute);opacity:.45}
.pill{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 12px 9px 16px;box-shadow:0 4px 18px rgba(0,0,0,.12);text-align:left}
.pill .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pill .txt b{font-weight:600}
.pin{border:0;background:none;padding:2px 6px;border-radius:6px;font-size:14px;opacity:.5}.pin[aria-pressed=true]{opacity:1;background:var(--accbg)}
/* 고양이 나비 — 표정은 눈으로만(m-*), 상태는 머리 밖 작은 표시(s-*). 마우스를 올리면 그르릉 */
.cat{flex:none;overflow:visible}
.cat .c-eyes circle{fill:#2A2A2E}
.cat .c-eyes path{fill:none;stroke:#2A2A2E;stroke-width:5;stroke-linecap:round}
.cat .c-mouth{fill:none;stroke:#2A2A2E;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.cat .s-dots circle{fill:#8FA9D6}.cat .s-spark{fill:#F5A524}.cat .s-heart{fill:#FF6F86}
.cat .s-q{font:800 30px -apple-system,sans-serif;fill:#2F6BFF}
.cat .s-bang circle{fill:#F5A524}.cat .s-bang path{stroke:#fff;stroke-width:4;stroke-linecap:round}.cat .s-bang circle:last-child{fill:#fff}
.cat .c-eyes>*,.cat [class^="s-"]{display:none}
.m-idle .e-dot,.m-look .e-dot,.m-alert .e-wide,.m-happy .e-happy,.m-done .e-happy,.m-think .e-think{display:inline}
.m-look .s-dots,.m-done .s-spark,.m-think .s-q,.m-alert .s-bang{display:inline}
.m-look .e-dot{transform:translateY(-6px)}.m-look .s-dots{animation:blink 1s infinite}
.small .c-mouth{display:none}
.blink .m-idle .e-dot,.blink .m-look .e-dot{display:none}
.blink .m-idle .e-blink,.blink .m-look .e-blink{display:inline}
.cat:hover .c-eyes>*,.cat:hover [class^="s-"]{display:none}
.cat:hover .e-closed,.cat:hover .s-heart{display:inline}
.say{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.bubble{flex:1;background:var(--accbg);color:var(--ink);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.5}
@keyframes blink{50%{opacity:.25}}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.enter{animation:drop .22s ease-out}
.panel{position:relative;width:100%;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:calc(100vh - 90px);overflow:auto}
.countdown{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);border-radius:0 0 0 16px;animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.stage-title{font-size:18px;font-weight:700;margin:2px 0}
.meta{font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--ok)}
h3{font-size:13px;color:var(--mute);margin:16px 0 6px;font-weight:600}
.ticker{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.ticker div{display:flex;gap:8px;padding:2px 0}.ticker .k{flex:none;width:76px;color:var(--mute);font-size:12px;padding-top:2px}
.ticker .done{color:var(--mute)}.ticker .now{font-weight:600}
.next{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.next b{color:var(--mute);font-weight:600;font-size:13px}
ul.crit{list-style:none;margin:0;padding:0}ul.crit li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
ul.crit li:first-child{border-top:0}.ck{flex:none;width:18px;text-align:center}.ck.y{color:var(--ok)}.ck.n{color:var(--mute)}
.sub{display:block;font-size:12px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:4px;vertical-align:1px}
.badge{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:0 4px 4px 0}
.badge.fix{background:var(--warnbg);color:var(--warn)}.badge.live{background:var(--okbg);color:var(--ok)}.badge.tmp{background:var(--line);color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:96px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{width:100%;padding:11px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.n-warn{background:var(--warnbg);color:var(--warn)}.n-bad{background:var(--badbg);color:var(--bad)}.n-acc{background:var(--accbg);color:var(--acc)}.n-ok{background:var(--okbg);color:var(--ok)}
.soon{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);font-size:13px}
details{margin-top:14px}summary{cursor:pointer;font-size:13px;color:var(--mute);font-weight:600}
.foot{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
/* 넘어가기 전 확인 */
.stages{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:10px 0}
.st{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--mute)}
.st.done{background:var(--okbg);color:var(--ok);border-color:transparent}.st.cur{background:var(--acc);color:var(--card);border-color:var(--acc);font-weight:600}
.arrow{color:var(--mute);font-size:11px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;margin:10px 0}
.flow .box{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;min-height:64px}
.flow .box b{display:block;font-size:11px;color:var(--mute)}
@media(max-width:520px){.flow{grid-template-columns:1fr}.flow .arrow{text-align:center}}
.ask{font-size:17px;font-weight:700;margin:16px 0 8px}
ol.todo{margin:0;padding:0;list-style:none}ol.todo li{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:14px}
ol.todo li span{flex:1}ol.todo .i{flex:none;width:20px;color:var(--mute)}
.plan{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}.plan div{margin-top:4px}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
</style>
</head>
<body>
<div class="tool">
  <div class="label"><span>사용자가 쓰는 AI 코딩 도구 자리 — 예시 화면이에요 (진짜 도구가 아니에요)</span>
    <button class="btn" id="play">▶ AI 도구로 작업하는 장면 보기</button></div>
  <div class="term" id="term" aria-live="polite"></div>
</div>

<div class="nav" id="nav"></div>

<script src="navigator.js"></script>
<script src="scenario.js"></script>
<script src="share-rules.js" onerror="this.remove()"></script>
<script src="../share-prototype/share-rules.js" onerror="this.remove()"></script>
<script>
(function(){
  const N = window.NavRules, S = window.NavScenario;
  const canLive = location.protocol.startsWith("http");
  const DELAY = { greet: 6000, home: 15000, petit: 30000 };   // 저절로 접히기까지(밀리초)
  const st = { ui: "greet", screen: "main", mode: canLive ? "live" : "fixture", text: S.examples[0].text,
    j: null, tokens: 0, busy: false, error: "", warn: null, todos: null, userPin: false, ping: "", openInput: false,
    step: "ask", hard: [], question: "", answer: "", noCount: 0, history: [] };
  const $nav = document.getElementById("nav");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const met = () => st.j ? st.j.criteria.map((c) => c.met) : [];
  const metCount = () => met().filter(Boolean).length;
  const left = () => met().length - metCount();
  const allDone = () => !!st.j && left() === 0;
  const stage = () => st.j && N.STAGES[st.j.stage];
  // 답을 기다리는 중이면 저절로 접히지 않는다 (CouCou의 pinned). 할 일을 다 했으면 확인하러 가자고 펼쳐 둔다
  const pinned = () => st.userPin || st.screen === "gate" || !!st.warn || st.busy || allDone();

  // ── 접힘·펼침 ──
  let hovering = false, timer = null, idleAt = 0, lastUi = null;
  function clearIdle(){ clearTimeout(timer); timer = null; }
  function scheduleIdle(){
    clearIdle();
    if (st.ui === "hidden" || (st.ui !== "greet" && (hovering || pinned()))) return;
    idleAt = Date.now();
    timer = setTimeout(() => { timer = null; go(N.nextView(st.ui, "idle", pinned())); }, DELAY[st.ui]);
  }
  function go(ui){ if (ui !== st.ui) { st.ui = ui; clearIdle(); } render(); }
  $nav.addEventListener("mouseenter", () => { hovering = true; if (st.ui !== "greet") clearIdle(); go(N.nextView(st.ui, "enter", pinned())); });
  $nav.addEventListener("mouseleave", () => { hovering = false; render(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") go(N.nextView(st.ui, "esc", pinned())); });

  // ── 진행 세 줄: 방금 한 일 / 지금 할 일 / 그다음 ──
  function ticker(){
    const c = st.j.criteria, s = stage(), nx = N.STAGES[s.n + 1];
    const done = [...c].reverse().find((x) => x.met);
    const todo = st.todos || c.filter((x) => !x.met).map((x) => x.text);
    const now = st.todos ? todo[0] : (st.j.next ? st.j.next.what : todo[0]);
    const after = st.todos || st.j.next ? todo[1] : null;
    return {
      done: done ? done.text : (st.history.length ? st.history[st.history.length - 1].short : ""),
      now: now || "다음 단계로 넘어가기 전에 함께 확인하기",
      after: after || (nx ? `${nx.n}단계 ${nx.title}` : "마무리"),
    };
  }

  // ── 고양이 나비 (모양은 목업과 같다. CouCou의 Mochi와 다르게: 귀 달린 실루엣 · 점 눈 · ω 입) ──
  const HEAD = "M24 44 L30 14 Q31 10 35 13 L52 30 Q60 28 68 30 L85 13 Q89 10 90 14 L96 44 Q108 58 104 78 Q98 104 60 106 Q22 104 16 78 Q12 58 24 44 Z";
  function cat(m, size){
    const r = size < 32 ? 7.5 : 6.5;
    return `<svg class="cat m-${m}${size < 32 ? " small" : ""}" width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">
      <path d="${HEAD}" fill="#F4A950"></path>
      <g class="c-eyes">
        <g class="e-dot"><circle cx="44" cy="66" r="${r}"></circle><circle cx="76" cy="66" r="${r}"></circle></g>
        <g class="e-wide"><circle cx="44" cy="66" r="9"></circle><circle cx="76" cy="66" r="9"></circle></g>
        <path class="e-happy" d="M37 69 Q44 59 51 69 M69 69 Q76 59 83 69"></path>
        <path class="e-closed" d="M37 64 Q44 72 51 64 M69 64 Q76 72 83 64"></path>
        <path class="e-blink" d="M37 66 L51 66 M69 66 L83 66"></path>
        <g class="e-think"><circle cx="44" cy="66" r="6.5"></circle><path d="M70 63 L83 68"></path></g>
      </g>
      <path class="c-mouth" d="M52 79 Q56 84 60 79 Q64 84 68 79"></path>
      <g class="s-dots"><circle cx="102" cy="36" r="3"></circle><circle cx="108" cy="27" r="4"></circle><circle cx="114" cy="17" r="5"></circle></g>
      <path class="s-spark" d="M108 6 L111 16 L120 19 L111 22 L108 32 L105 22 L96 19 L105 16 Z"></path>
      <text class="s-q" x="100" y="36">?</text>
      <g class="s-bang"><circle cx="108" cy="22" r="11"></circle><path d="M108 15 L108 24"></path><circle cx="108" cy="29.5" r="2.2"></circle></g>
      <path class="s-heart" d="M100 22 C100 16 108 16 108 22 C108 16 116 16 116 22 C116 29 108 33 108 36 C108 33 100 29 100 22 Z"></path>
    </svg>`;
  }
  // 지금 상황의 [표정, 말풍선] — 위에 있는 상황이 먼저다
  const GATE_FACE = {
    ask: ["done", "이번 단계에서 한 일, 같이 볼까요?"],
    which: ["think", "모르는 게 당연해요. 어디가 헷갈렸어요?"],
    question: ["think", "편하게 물어보세요. 쉬운 말로 답할게요."],
    plan: ["think", "한 장으로 정리했어요. 이제 어때요?"],
    next: ["happy", "좋아요! 다음에 할 일 순서를 정해 봐요."],
  };
  function face(){
    if (st.busy) return ["look", "어디쯤인지 살펴보고 있어요…"];
    if (st.warn) return ["alert", "보내기 전에 잠깐! 아래 안내를 봐 주세요."];
    if (st.error) return ["think", "음, 잘 안 됐어요. 아래 안내를 봐 주세요."];
    if (st.screen === "gate") return GATE_FACE[st.step];
    if (!st.j) return ["idle", "지금 만들고 있는 걸 보여 주시면, 어디쯤인지와 다음에 할 일을 알려 드릴게요."];
    if (allDone()) return ["done", "할 일을 다 했어요! 넘어가기 전에 같이 확인해 봐요."];
    return ["idle", `지금은 ${stage().n}단계예요. 이것부터 같이 해 봐요 — ${ticker().now}`];
  }
  const sayRow = () => { const [m, say] = face(); return `<div class="say">${cat(m, 52)}<div class="bubble" aria-live="polite">${esc(say)}</div></div>`; };

  // 눈 따라오기 — 눈은 통째로, 입은 절반만 커서 쪽으로. 움직임 줄이기 설정이면 하지 않는다
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let mouse = null, raf = 0;
  function follow(){
    raf = 0;
    if (!mouse || still) return;
    for (const svg of $nav.querySelectorAll("svg.cat")) {
      const b = svg.getBoundingClientRect(), k = 120 / b.width;
      const dx = (mouse.x - (b.left + b.width / 2)) * k, dy = (mouse.y - (b.top + b.height * 0.58)) * k;
      const d = Math.hypot(dx, dy) || 1, m = 7 * Math.min(1, d / 220), ex = dx / d * m, ey = dy / d * m * 0.8;
      svg.querySelector(".c-eyes").setAttribute("transform", `translate(${ex.toFixed(1)} ${ey.toFixed(1)})`);
      svg.querySelector(".c-mouth").setAttribute("transform", `translate(${(ex / 2).toFixed(1)} ${(ey / 2).toFixed(1)})`);
    }
  }
  document.addEventListener("mousemove", (e) => { mouse = { x: e.clientX, y: e.clientY }; if (!raf) raf = requestAnimationFrame(follow); });
  if (!still) setInterval(() => { $nav.classList.add("blink"); setTimeout(() => $nav.classList.remove("blink"), 140); }, 3400);

  function pill(){
    let txt;
    if (st.busy) txt = "<b>살펴보는 중이에요…</b> 조금만 기다려 주세요";
    else if (st.ping) txt = `<b>${esc(st.ping)}</b>`;
    else if (!st.j) txt = "<b>Navigator</b> · 눌러서 지금 만드는 걸 보여 주세요";
    else {
      const s = stage(), t = ticker();
      txt = `${allDone() ? "<b>할 일을 다 했어요!</b> · " : ""}<b>${s.n}단계 ${esc(s.short)}</b> · ${met().length}개 중 ${metCount()}개 했어요 · 지금: ${esc(t.now)}`;
    }
    const pin = st.ui === "home" ? `<button class="pin" data-act="pin" aria-pressed="${st.userPin}" title="열어 두기 — 저절로 접히지 않아요">📌</button>` : "";
    return `<div class="pill" role="button" tabindex="0" data-act="pill" aria-expanded="${st.ui === "home"}">${cat(st.ping ? "happy" : face()[0], 30)}<span class="txt">${txt}</span>${pin}<span aria-hidden="true">${st.ui === "home" ? "▴" : "▾"}</span></div>`;
  }

  function footer(){
    const b = st.mode === "live"
      ? `<span class="badge live">진짜 AI(Claude)가 봤어요${st.tokens ? ` · 읽고 쓴 양 약 ${st.tokens.toLocaleString()}토큰` : ""}</span>`
      : `<span class="badge fix">연습용 예시예요 — 진짜 AI가 아니에요</span>`;
    return `<div class="foot"><div class="row">${b}<span class="badge tmp">안내 기준은 아직 시험판이에요</span></div>
      <div class="row meta">보기 방식 <select data-act="mode" aria-label="보기 방식">
        <option value="fixture" ${st.mode==="fixture"?"selected":""}>연습용 예시</option>
        <option value="live" ${st.mode==="live"?"selected":""} ${canLive?"":"disabled"}>진짜 AI (Claude)${canLive?"":" — server.js를 켜야 해요"}</option></select></div></div>`;
  }

  function inputBox(){
    let h = `<textarea data-act="text" aria-label="지금 만드는 것">${esc(st.text)}</textarea>
      <div class="row" style="margin-top:6px">${S.examples.map((e,i)=>`<button class="btn" data-act="ex" data-i="${i}">${esc(e.label)}</button>`).join("")}
      <span style="flex:1"></span><button class="btn pri" data-act="judge" ${st.busy?"disabled":""}>어디쯤인지 보기</button></div>`;
    if (st.mode === "live") h += `<div class="meta" style="margin-top:4px">보여 주신 글은 AI(Claude)에게 보내져요. 비밀번호나 다른 사람 연락처는 빼 주세요.</div>`;
    if (st.warn) h += `<div class="note n-warn"><b>보내기 전에 잠깐!</b> 글 안에 ${esc(st.warn.join(", "))}처럼 보이는 게 있어요. 그래도 AI에게 보낼까요?
      <div class="row" style="margin-top:8px"><button class="btn" data-act="send-anyway">괜찮아요, 보낼게요</button><button class="btn pri" data-act="edit">고칠게요</button></div></div>`;
    if (st.error) h += `<div class="note n-bad">${esc(st.error)}</div>`;
    return h;
  }

  function mainView(){
    if (!st.j) return `${sayRow()}<div class="stage-title">지금 만들고 있는 걸 보여 주세요</div>
      <p class="meta" style="margin:0 0 8px">무엇을 만들고 있고, 어디까지 했는지 편하게 적어 주세요. 연습용 예시 버튼을 눌러 봐도 돼요.</p>
      <h3>${esc(S.PROJECT)} (연습용 예시)</h3>${inputBox()}${footer()}`;
    const s = stage(), t = ticker(), all = !left();
    let h = `${sayRow()}<div class="meta">지금 어디쯤?</div><div class="stage-title">${s.n}단계 · ${esc(s.title)}</div>
      <div class="bar" aria-hidden="true"><i style="width:${Math.round(metCount() / met().length * 100)}%"></i></div>
      <div class="meta">이 단계에서 할 일 ${met().length}개 중 ${metCount()}개 했어요 · ${esc(st.j.reason)}</div>`;
    if (all) h += `<div class="note n-ok"><b>할 일을 다 했어요!</b> 넘어가기 전에 이번 단계를 이해했는지 같이 확인해 봐요.</div>`;
    h += `<h3>진행</h3><div class="ticker">
      ${t.done ? `<div class="done"><span class="k">✓ 방금 한 일</span><span>${esc(t.done)}</span></div>` : ""}
      <div class="now"><span class="k">● 지금 할 일</span><span>${esc(t.now)}</span></div>
      <div class="done"><span class="k">○ 그다음</span><span>${esc(t.after)}</span></div></div>`;
    if (st.todos) h += `<h3>내가 정한 순서</h3><ol class="todo">${st.todos.map((x,i)=>`<li><span class="i">${i+1}</span><span>${esc(x)}</span></li>`).join("")}</ol>`;
    else if (st.j.next) { const n = st.j.next;
      h += `<h3>지금 할 일</h3><div class="next"><b>할 일</b><span>${esc(n.what)}</span><b>왜 해요?</b><span>${esc(n.why)}</span><b>골라 주세요</b><span>${esc(n.decision)}</span><b>이렇게 해 보세요</b><span>${esc(n.action)}</span></div>`; }
    h += `<h3>이 단계에서 할 일 ${met().length}개</h3>${critList(true)}`;
    h += `<div style="margin-top:14px"><button class="btn pri big" data-act="gate" ${all?"":"disabled"}>다음 단계로 넘어가기</button>
      <div class="meta" style="text-align:center;margin-top:4px">${all ? "할 일을 다 했어요. 넘어가기 전에 한 번만 같이 확인해요." : `아직 ${left()}개 남았어요. 다 하면 넘어갈 수 있어요.`}</div></div>`;
    h += `<h3>설계도 함께 쓰기</h3><div class="soon"><span class="badge tmp">곧 열려요</span> AI가 설계도 초안을 먼저 써 드리고, 고치시면 다시 봐 드리는 자리예요.</div>`;
    h += `<details ${st.error||st.warn||st.openInput?"open":""}><summary>바뀐 작업 다시 보여 주기</summary><div style="margin-top:8px">${inputBox()}</div></details>`;
    if (st.history.length) h += `<h3>지나온 단계</h3>` + st.history.map((x)=>`<div class="meta">${esc(x.text)}</div>`).join("");
    return h + footer();
  }

  // 할 일 목록 — 용어 표시는 펼친 패널에서만 (넘어가기 전 확인 화면은 한 일만 짧게)
  const critList = (terms) => `<ul class="crit">${st.j.criteria.map((c) => `<li><span class="ck ${c.met ? "y" : "n"}">${c.met ? "✓" : "○"}</span><span>${esc(c.text)}${
    terms && c.term ? `<span class="tag" title="전문가들이 부르는 이름이에요">용어: ${esc(c.term)}</span>` : ""}${
    c.evidence ? `<span class="sub">적어 주신 글: "${esc(c.evidence)}"</span>` : ""}</span></li>`).join("")}</ul>`;

  function diagram(){
    const s = stage();
    return `<div class="stages">${N.STAGES.map((x)=>`<span class="st ${x.n<s.n?"done":x.n===s.n?"cur":""}">${x.n<s.n?"✓ ":""}${x.n} ${esc(x.short)}</span>`).join(`<span class="arrow">→</span>`)}</div>
      <div class="flow"><div class="box"><b>받은 것</b>${esc(s.gets)}</div><span class="arrow">→</span>
      <div class="box"><b>한 일</b>${esc(s.does)}</div><span class="arrow">→</span>
      <div class="box"><b>만든 것</b>${esc(s.gives)}</div></div>${critList(false)}`;
  }

  function gateView(){
    const s = stage(), nx = N.STAGES[s.n + 1];
    let h = `<div class="row"><span class="meta" style="flex:1">넘어가기 전에 함께 확인해요${st.mode==="fixture"?" · 연습용 예시":""}</span><button class="btn" data-act="close-gate">나중에 할게요</button></div>
      ${sayRow()}<div class="stage-title">${s.n}단계 "${esc(s.title)}"에서 이렇게 했어요</div>${diagram()}`;
    const askYN = `<div class="ask">이번 단계에서 한 일, 이해되셨나요?</div>
      <div class="row"><button class="btn pri" data-act="yes">네, 이해했어요</button><button class="btn" data-act="no">아니요, 잘 모르겠어요</button>
      ${st.noCount?`<span class="meta">다시 물어본 횟수 ${st.noCount}번</span>`:""}</div>
      <div class="meta" style="margin-top:6px">모르는 게 당연해요. "아니요"를 누르면 헷갈린 부분을 같이 풀어 봐요.</div>`;
    if (st.step === "ask") return h + askYN;
    if (st.step === "which") return h + `<div class="ask">어디가 헷갈렸나요?</div><div class="meta">여러 개 골라도 돼요.</div>` +
      s.criteria.map((c,i)=>`<label class="chk"><input type="checkbox" data-act="hard" data-i="${i}" ${st.hard.includes(i)?"checked":""}>${esc(c.text)}</label>`).join("") +
      `<div class="row" style="margin-top:8px"><button class="btn pri" data-act="to-question" ${st.hard.length?"":"disabled"}>다음</button></div>`;
    if (st.step === "question") return h + `<div class="ask">궁금한 걸 편하게 물어보세요</div>
      <textarea data-act="question" placeholder="예) 꼭 필요한지 표시하는 건 왜 해요?">${esc(st.question)}</textarea>
      <div class="row" style="margin-top:6px"><button class="btn pri" data-act="answer" ${st.busy?"disabled":""}>물어보기</button>
      ${st.answer?`<button class="btn" data-act="plan">한 장 요약 보기</button>`:""}</div>
      ${st.answer?`<div class="note n-acc">${esc(st.answer)}</div>`:""}${st.error?`<div class="note n-bad">${esc(st.error)}</div>`:""}`;
    if (st.step === "plan") return h + `<div class="ask">이번 단계 한 장 요약</div><div class="plan">
      <div><b>받은 것</b> ${esc(s.gets)}</div><div><b>한 일</b> ${esc(s.does)}</div><div><b>만든 것</b> ${esc(s.gives)}</div>
      <div><b>헷갈렸던 부분</b> ${esc(st.hard.map((i)=>s.criteria[i].text).join(", "))}</div>
      <div><b>받은 답</b> ${esc(st.answer)}</div>
      ${nx?`<div><b>다음 단계</b> ${nx.n}단계 ${esc(nx.title)} — ${esc(nx.does)}</div>`:""}</div>` + askYN;
    if (st.step === "next") return h + `<div class="ask">좋아요! 다음은 ${nx?`${nx.n}단계 "${esc(nx.title)}"`:"마무리"}예요</div>
      <div class="meta" style="margin-bottom:6px">무엇부터 할지 순서를 정해 보세요. ↑↓로 옮길 수 있어요.</div>
      <ol class="todo">${st.todos.map((t,i)=>`<li><span class="i">${i+1}</span><span>${esc(t)}</span>
        <button class="btn" data-act="up" data-i="${i}" aria-label="위로" ${i===0?"disabled":""}>↑</button>
        <button class="btn" data-act="down" data-i="${i}" aria-label="아래로" ${i===st.todos.length-1?"disabled":""}>↓</button></li>`).join("")}</ol>
      <button class="btn pri big" data-act="go" ${N.canAdvance(met(),"yes")?"":"disabled"}>이 순서로 시작하기</button>`;
    return h;
  }

  function render(){
    if (!timer) scheduleIdle();
    const moved = st.ui !== lastUi; lastUi = st.ui;
    const cls = moved ? " enter" : "";
    if (st.ui === "hidden") $nav.innerHTML = `<button class="strip" data-act="strip" aria-label="Navigator 열기" title="마우스를 올리면 나타나요"><i></i></button>`;
    else if (st.ui === "greet") $nav.innerHTML = `<div class="panel greet${cls}"><div class="say">${cat("happy", 64)}<div class="bubble">
      <b>안녕하세요! 저는 길잡이 고양이 나비예요.</b><br>지금 만들고 있는 걸 보여 주시면, 몇 단계쯤인지와 다음에 할 일을 알려 드려요. 평소엔 화면 위에 작게 있을게요.</div></div>
      <button class="btn pri" data-act="open">보여 주기</button></div>`;
    else $nav.innerHTML = `<div class="${cls.trim()}" style="width:100%">${pill()}</div>` + (st.ui === "home"
      ? `<div class="panel${cls}">${st.screen === "gate" ? gateView() : mainView()}${countdown()}</div>` : "");
    follow();
  }
  function countdown(){
    if (hovering || pinned() || !timer) return "";
    return `<div class="countdown" title="곧 접혀요 — 📌을 누르면 열어 둬요" style="animation-duration:${DELAY.home}ms;animation-delay:-${Date.now() - idleAt}ms"></div>`;
  }

  // ── AI 호출 — 기다리는 동안 나비가 "살펴보는 중" ──
  async function callAI(url, body){
    st.busy = true; render();
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return await r.json();
    } catch { return { ok: false, reason: "AI에 연결하지 못했어요. server.js를 켜거나, 보기 방식을 '연습용 예시'로 바꿔 주세요" }; }
    finally { st.busy = false; }
  }
  const WARN_NAME = { secret: "비밀번호나 비밀 열쇠", rrn: "주민등록번호", email: "이메일 주소", phone: "전화번호", ip: "인터넷 주소(IP)" };
  function sensitive(text){
    if (!window.ShareRules) return [];
    // 값은 다시 보이지 않고 종류만 말한다
    return [...new Set(window.ShareRules.scan(text).findings.filter((x)=>WARN_NAME[x.type]).map((x)=>WARN_NAME[x.type]))];
  }
  function landed(j, tokens){
    st.j = j; st.tokens = tokens || 0; st.todos = null; st.openInput = false;
    // 다 했으면 스스로 펼쳐서 알린다(CouCou의 alert), 아니면 접혀 있던 것만 한 줄로 보인다
    go(allDone() ? N.nextView(st.ui, "alert", pinned()) : st.ui === "hidden" ? "petit" : st.ui);
  }

  async function judge(skipCheck){
    st.error = ""; st.warn = null;
    if (!st.text.trim()) { st.error = "지금 만드는 걸 적어 주세요."; return render(); }
    if (st.mode === "fixture") {
      const raw = S.judgeFixture(st.text), j = raw && N.parseJudgement(raw);
      if (!j) { st.error = "연습용 예시는 '연습 1·2' 글만 알아요. 직접 쓴 글은 보기 방식을 '진짜 AI'로 바꿔 주세요."; return render(); }
      return landed(j, 0);
    }
    if (!skipCheck) { const w = sensitive(st.text); if (w.length) { st.warn = w; return render(); } }
    const r = await callAI("/api/judge", { text: st.text });
    if (r.ok) return landed(r.judgement, r.tokens);
    st.error = `살펴보지 못했어요 — ${r.reason || "이유를 알 수 없어요"}. 아무 답이나 지어내지 않고 비워 둘게요.`;
    render();
  }

  async function answer(){
    st.error = "";
    const s = stage();
    if (st.mode === "fixture") {
      const a = (S.answers[s.n] || [])[st.hard[0]];
      st.answer = a ? `${a} (연습용으로 미리 써 둔 답이라, 질문 내용은 반영되지 않아요)` : "연습용 답이 없어요. 보기 방식을 '진짜 AI'로 바꿔 물어보세요.";
      return render();
    }
    if (!st.question.trim()) { st.error = "궁금한 걸 적어 주세요."; return render(); }
    const r = await callAI("/api/answer", { stage: s.n, hard: st.hard.map((i)=>s.criteria[i].text), question: st.question, text: st.text });
    if (r.ok) { st.answer = r.answer; st.tokens = r.tokens; } else st.error = `답을 받지 못했어요 — ${r.reason || "이유를 알 수 없어요"}`;
    render();
  }

  function advance(){
    const s = stage(), nx = N.STAGES[s.n + 1];
    st.history.push({ short: `${s.n}단계 ${s.title} 마침`,
      text: `${s.n}단계 "${s.title}" → ${nx ? `${nx.n}단계로 넘어갔어요` : "마무리했어요"} · '잘 모르겠어요' ${st.noCount}번 · ${new Date().toISOString().slice(0,10)}` });
    st.screen = "main";
    if (nx) st.j = { stage: nx.n, reason: `${s.n}단계를 마쳤어요.`, criteria: nx.criteria.map((c)=>({ text: c.text, term: c.term, met: false, evidence: "" })), next: null };
    render();
  }

  // ── 누르기 — data-act 이름 → 할 일 ──
  const set = (patch) => { Object.assign(st, patch); render(); };
  const ACT = {
    strip: () => go(N.nextView(st.ui, "enter", pinned())),
    open: () => go(N.nextView(st.ui, "click", pinned())),
    pin: () => { clearIdle(); set({ userPin: !st.userPin }); },
    pill: () => {
      // 한 줄 알림("작업이 바뀌었어요")을 누르면 알림은 지우고, 바뀐 작업을 보여 주는 칸을 펼쳐 둔다
      if (st.ping) Object.assign(st, { ping: "", openInput: true });
      go(st.ui === "home" ? "petit" : N.nextView(st.ui, "click", pinned()));
    },
    ex: (i) => { st.text = S.examples[i].text; judge(true); },
    judge: () => judge(false),
    "send-anyway": () => judge(true),
    edit: () => { set({ warn: null }); $nav.querySelector("[data-act=text]").focus(); },
    gate: () => set({ screen: "gate", step: "ask", hard: [], question: "", answer: "", noCount: 0, error: "" }),
    "close-gate": () => set({ screen: "main" }),
    no: () => set({ noCount: st.noCount + 1, step: "which", hard: [], answer: "", question: "" }),
    "to-question": () => set({ step: "question" }),
    answer: () => answer(),
    plan: () => set({ step: "plan" }),
    yes: () => { const nx = N.STAGES[stage().n + 1]; set({ todos: nx ? nx.criteria.map((c) => c.text) : [], step: "next" }); },
    up: (i) => set({ todos: N.reorder(st.todos, i, -1) }),
    down: (i) => set({ todos: N.reorder(st.todos, i, 1) }),
    go: () => advance(),
  };
  $nav.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (t && ACT[t.dataset.act]) ACT[t.dataset.act](Number(t.dataset.i));
  });
  $nav.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset.act === "pill") e.target.click(); });
  $nav.addEventListener("change", (e) => {
    const a = e.target.dataset.act;
    if (a === "mode") { st.mode = e.target.value; st.error = ""; st.warn = null; render(); }
    if (a === "hard") { const i = Number(e.target.dataset.i); st.hard = e.target.checked ? [...st.hard, i].sort() : st.hard.filter((x)=>x!==i); render(); }
  });
  $nav.addEventListener("input", (e) => {
    if (e.target.dataset.act === "text") st.text = e.target.value;
    if (e.target.dataset.act === "question") st.question = e.target.value;
  });

  // ── 뒤쪽 예시 화면: AI 도구로 작업하는 장면 ──
  const LINES = [
    ["me", "> 동아리 행사 등록 앱 만들고 싶어. 회원이 행사 보고 신청하는 거"],
    ["", "좋아요. 먼저 필요한 기능부터 정리해 볼까요? 신청 화면, 행사 목록, 마감 알림…"],
    ["me", "> 필요한 기능 6개를 문장으로 정리해 줘"],
    ["", "1. 회원이 신청 버튼을 누르면, 앱은 신청서를 보여 준다."],
    ["", "2. 등록은 빠르게 끝나야 한다."],
    ["dim", "…"],
    ["me", "> 좋아, 바로 화면 만들자"],
  ];
  const $term = document.getElementById("term");
  const line = ([cls, text]) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; $term.appendChild(d); };
  LINES.forEach(line);
  document.getElementById("play").addEventListener("click", () => {
    $term.textContent = ""; let k = 0;
    const step = () => {
      if (k < LINES.length) { line(LINES[k++]); return setTimeout(step, 700); }
      // 작업이 바뀐 걸 알아채고 한 줄로 살짝 나타난다 — 글을 AI에게 보내는 건 사용자가 누를 때만
      st.text = S.examples[0].text; st.ping = "방금 작업이 바뀌었어요 — 눌러서 어디쯤인지 볼까요?";
      go(st.ui === "hidden" || st.ui === "greet" ? "petit" : st.ui);
    };
    step();
  });

  render();
})();
</script>
</body>
</html>
