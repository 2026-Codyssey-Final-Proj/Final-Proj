<!doctype html>
<!-- claude-drafted: 2026-10-21 — 앱(Electron)의 설정 창 · 퀘스트 창(C-22, 이재엽 "창 셋"). 주소 끝 #settings · #quest.
     내용은 섬(app.js setwinHTML · qwinHTML)이 그려서 보내고(floeApp.onWinHtml), 여기서는 보이기만 한다. 누름 · 바뀜 · 입력 · Esc는 섬으로 돌려보낸다(win.js → floeApp.winEvent).
     브라우저로 열면(앱 밖) 내용이 없다 — 브라우저에서는 섬 옆의 판(index.html)이 같은 것을 보인다. 모양은 app.css(맨 아래 C-22)를 그대로 쓴다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floe — 창</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="seal.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="library-tab.css">
<link rel="stylesheet" href="../library/book-view.css">
<style>
/* 창 하나가 곧 판 하나 — 창 가득, 테두리 · 그림자 없이. 머리띠를 잡고 창을 끈다(단추는 빼고) */
html.in-win,html.in-win body{margin:0;background:#363E62;overflow:hidden;height:100%}   /* 섬 색(C-57 — 웹사이트 회남색) */
html.in-win.win-quest,html.in-win.win-quest body{background:#E9EEF6}   /* 작업실(C-41, 2026-10-26) — 파스텔. main.js backgroundColor · app.css html.win-quest와 같은 값 */
html.in-win.win-quest .win-empty{color:#4A5678}
html.in-win .window,html.in-win .nav,html.in-win .phone{display:none}
html.in-win.win-quest #root>.wh{background:#E2E9F4}   /* 머리 줄은 작업실 바탕(눈색) — 판과 옆 칸 위에 하나 */
/* 창 = 머리 줄(.wh, 창 전체 폭) + 작업실 판(.win) + 섬 옆 칸(.isl-col, C-41 ⑤) — C-62 머리 줄 하나(2026-10-29): 격자 "wh wh" / "win isl". 옆 칸은 오른쪽만(2026-10-28 합의 — 위 · 아래 · 왼쪽 자리를 뺐다),
   너비는 --col-w(win.js, 접히면 56). 0.3초(기준 8), 움직임 줄이기면 바로 */
#root{height:100vh;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) var(--col-w,420px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"wh wh" "win isl";transition:grid-template-columns .3s cubic-bezier(.2,.8,.2,1)}
#root>.wh{grid-area:wh}
#root>.win{grid-area:win;min-width:0;min-height:0;width:auto!important;height:auto!important;max-height:none;border:0;border-radius:0;box-shadow:none;animation:none}
#root>.isl-col{grid-area:isl;min-width:0;min-height:0}
html.hd-drag #root{transition:none}
@media (prefers-reduced-motion:reduce){#root{transition:none}}
#root .wh{-webkit-app-region:drag;cursor:grab}
#root .wh button,#root .wh select{-webkit-app-region:no-drag}
/* 옆 칸 크기 손잡이(win.js, C-41 ③ · ⑤) — 옆 칸의 안쪽 가장자리에 14px 띠, 가운데 작은 막대. 끄는 동안은 칸 · 손잡이가 바로 따라온다(transition 없이) */
#hd{position:fixed;z-index:5;display:grid;place-items:center;touch-action:none;transition:left .3s cubic-bezier(.2,.8,.2,1),top .3s cubic-bezier(.2,.8,.2,1)}
#hd[hidden]{display:none}   /* display:grid가 [hidden]을 이기지 않게 — 붙기 전에는 tab 순서에도 없어야 한다(새 맥락 리뷰 2026-10-27) */
#hd span{display:block;border-radius:4px;background:#BCC8DD}
#hd.v{cursor:ew-resize}#hd.v span{width:6px;height:64px}
#hd.h{cursor:ns-resize}#hd.h span{width:64px;height:6px}
#hd:hover span,#hd:focus-visible span{background:#2E4A9A}
#hd:focus-visible{outline:2px solid #2E4A9A;outline-offset:-2px}
html.hd-drag #hd{transition:none}
@media (prefers-reduced-motion:reduce){#hd{transition:none}}
.win-empty{padding:24px;color:#B9C7E6;font:14px/1.6 var(--font-text)}
</style>
</head>
<body>
<div id="root"><p class="win-empty">앱 안에서 섬이 보내는 내용이 여기에 떠요.</p></div>
<div id="fx"></div>
<script src="../../03-backend/navigator/md-view.js"></script>   <!-- C-53 서식 단추 — 글 칸이 이 창 안에 있어 win.js가 같은 함수(format)로 넣는다 -->
<script src="canvas-pan.js"></script>   <!-- 캔버스 끌어서 옮기기 · 크게 작게(F-66, 2026-10-27) — win.js보다 먼저 -->
<script src="win.js"></script>
</body>
</html>
