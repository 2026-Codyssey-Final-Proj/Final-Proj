<!doctype html>
<!-- claude-drafted: 2026-10-17 — 이재엽의 요청("책 안에서 보다는 하늘에서 별을 보는 내용으로 · 1월부터 12월까지의 별자리로 무슨 이야기의 별자리인지 ·
     어느 곳에 어느 거예요라고 확실한 직관적인 UI · 지식들이 정리되고 깃허브와 연동")으로 만든 시안. 더미 데이터, GitHub을 실제로 부르지 않는다.
     주소 끝: #m10(10월 하늘) · #year(한 해 하늘) · #m10-2(10월 ★2 고름) · #q=EARS(검색) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식 별자리 — 2026년 하늘</title>
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="sky.css">
</head>
<body class="skyview">
<div class="sky" id="sky" aria-hidden="true"></div>

<a class="pillbtn glass back" href="index.html#lib">← 얼음 서고로</a>
<div class="lib-head glass"><b>지식 별자리 · 2026년 하늘</b><span id="count"></span></div>

<section class="gh glass" aria-label="GitHub 연동">
  <div class="gh-row"><span class="gh-ic" aria-hidden="true">⎇</span><b>GitHub</b><span class="gh-repo" id="gh-repo"></span></div>
  <div class="gh-meta" id="gh-meta"></div>
  <button class="pillbtn pri" id="gh-pull"></button>
</section>

<form class="search glass" id="search" role="search" autocomplete="off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  <label class="sr" for="q">별자리에서 지식 찾기</label>
  <input id="q" type="search" placeholder="지식 찾기 — 어느 달, 어느 별자리, 몇 번째 별인지 알려 줘요" enterkeyhint="search">
  <span class="kbd" aria-hidden="true">/</span>
</form>

<main class="skymain" id="main">
  <section class="story" aria-live="polite">
    <div class="story-head" id="story-head"></div>
    <svg class="const" id="const" viewBox="-8 -8 116 100" role="img" aria-labelledby="story-title"></svg>
  </section>
  <aside class="panel glass" id="panel" aria-label="이 별자리에 떠 있는 지식"></aside>
</main>

<section class="year" id="year" hidden aria-label="한 해 하늘"></section>

<nav class="months glass" id="months" aria-label="달 고르기"></nav>

<div class="floro" aria-hidden="true"><div id="seal"></div><div class="say glass" id="say"></div></div>
<div class="toast glass" id="toast" hidden role="status"></div>

<script src="../navigator/seal.js"></script>
<script src="knowledge-sky.js"></script>
<script src="sky-data.js"></script>
<script src="search.js"></script>
<script src="spotlight.js"></script>
<script src="sky.js"></script>
</body>
</html>
