<!doctype html>
<!-- claude-drafted: 2026-10-20 — 이재엽 요청(C-11 모아 보기 창 — 바이브 코딩 고르기 · 알림, C-12 AI 진행의 화면 쪽). 섬과 따로 뜨는 보통 창 하나.
     서버 없이 파일로도 열린다(FR-10 — 알림은 이 브라우저의 섬 기록, AI 진행은 예시). 앱(02-frontend/electron)은 메뉴 · 트레이 · Dock · 섬의 단추로 연다.
     주소 끝 #vibe(기본) · #alerts · #ai 로 공간을 바로 연다(시험 · 녹화용). 글은 모두 쉬운 말(FR-13) — '허브' 대신 '모아 보기'. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floe — 모아 보기</title>
<link rel="stylesheet" href="../navigator/seal.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="hub">
  <nav class="side" aria-label="공간 고르기">
    <div class="brand"><span id="seal" class="seal" aria-hidden="true"></span><span class="brand-t"><b>Floe</b><small>모아 보기</small></span></div>
    <div class="spaces" role="tablist" aria-label="공간">
      <button type="button" class="sp" role="tab" data-space="vibe" aria-selected="true" aria-controls="p-vibe">바이브 코딩</button>
      <button type="button" class="sp" role="tab" data-space="alerts" aria-selected="false" aria-controls="p-alerts">알림<span class="badge" id="unread" hidden>0</span></button>
      <button type="button" class="sp" role="tab" data-space="ai" aria-selected="false" aria-controls="p-ai">AI 진행<span class="dot" id="working" hidden title="일하는 중"></span></button>
    </div>
    <p class="side-note" id="side-note"></p>
  </nav>
  <main class="pane">
    <section id="p-vibe" role="tabpanel" data-panel="vibe" aria-label="바이브 코딩">
      <h1>바이브 코딩</h1>
      <p class="lead">무엇을 할까요?</p>
      <div class="cards">
        <article class="card">
          <span class="k">만드는 중</span>
          <h2>바이브 코딩</h2>
          <p>단계마다 어디까지 왔는지 보면서 만들어요. 플로로가 섬에서 길을 알려 줘요.</p>
          <button type="button" class="btn pri" data-act="enter">들어가기</button>
        </article>
        <article class="card">
          <span class="k">끝낸 것</span>
          <h2>서재</h2>
          <p>끝낸 책을 다시 펼쳐 봐요. 단계마다 정한 것 · 배운 것이 책에 남아 있어요.</p>
          <button type="button" class="btn" data-act="library">열기</button>
        </article>
      </div>
      <p class="now" id="now" aria-live="polite">아직 시작 전이에요</p>
    </section>
    <section id="p-alerts" role="tabpanel" data-panel="alerts" aria-label="알림" hidden>
      <h1>알림</h1>
      <p class="lead">AI 코딩 도구가 보낸 알림이에요 — 섬의 기록과 같아요. 새것이 위예요.</p>
      <div id="alerts-body"></div>
    </section>
    <section id="p-ai" role="tabpanel" data-panel="ai" aria-label="AI 진행" hidden>
      <h1>AI 진행</h1>
      <p class="lead">Claude Code가 한 일을 한 줄씩 보여 줘요 — 바이브 코딩 안내와는 따로예요. 파일 내용은 받지 않고, 이름 · 첫 줄 · 줄 수만 와요.</p>
      <div id="ai-body"></div>
    </section>
  </main>
</div>
<script src="../navigator/seal.js"></script>
<!-- AI 진행의 줄 글(window.NavSteps) — 다른 에이전트의 파일. 아직 없어도 화면은 멈추지 않는다 -->
<script src="../../03-backend/navigator/steps.js" onerror="this.remove()"></script>
<script src="hub.js"></script>
</body>
</html>
