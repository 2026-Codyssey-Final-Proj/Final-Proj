<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigator 시연 화면</title>
<!-- claude-drafted: 2026-10-14 — 사용자 요청("1, 2번 모두 진행")으로 Claude가 모양을 보이려고 만든 시연 초안이다. 값은 전부 가상이고 서버·네트워크를 쓰지 않는다(FR-10). 실제 화면은 임유정·고한결이 정한다. -->
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1f1e1d;--muted:#6b6a65;--border:#d9d7cf;--accent-bg:#e6f1fb;--accent:#0c447c;--warn-bg:#faeeda;--warn:#633806;--danger:#a32d2d}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#262624;--text:#eceae4;--muted:#a8a69d;--border:#3d3d3a;--accent-bg:#0c447c;--accent:#b5d4f4;--warn-bg:#633806;--warn:#faeeda;--danger:#f09595}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:500;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:12px 14px}
.lb{font-size:12px;color:var(--muted);margin:0 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-top:.5px solid var(--border)}
.row:first-of-type{border-top:0}
.chip{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--accent-bg);color:var(--accent)}
.warn{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.err{font-size:12px;color:var(--danger);margin:4px 0 0}
.form{display:grid;gap:8px}
input,select,button{font:inherit;font-size:14px;padding:8px 10px;border:.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
button{cursor:pointer}
.note{font-size:12px;color:var(--muted);margin:12px 0 0}
</style>
</head>
<body>
<main>
  <h1>Navigator 시연 화면</h1>
  <p class="sub">일을 넣고, 겹침을 보고, 완료하며 배운 것을 책장에 쌓는다. 가상 데이터이며 이 화면 안에서만 저장된다.</p>
  <div class="grid">
    <section class="card" aria-label="일 넣기">
      <p class="lb">1 일 넣기 (오늘 2026-10-14)</p>
      <div class="form">
        <input id="nm" type="text" placeholder="예: 발표 자료 정리" aria-label="일 이름">
        <select id="pp" aria-label="목적"><option>작업</option><option>학교</option><option>생활</option><option>대회</option><option>기타</option></select>
        <input id="dl" type="date" value="2026-10-20" aria-label="마감">
        <button id="add" type="button">넣기</button>
        <p class="err" id="e1" hidden></p>
        <div id="cf" hidden></div>
      </div>
    </section>
    <section class="card" aria-label="할 일과 남은 날">
      <p class="lb">2 할 일과 남은 날</p>
      <div id="ls"></div>
      <div id="lr" class="form" hidden style="margin-top:8px">
        <input id="lw" type="text" placeholder="배운 것 한 줄 (모르면 미정)" aria-label="배운 것">
        <button id="sv" type="button">완료하고 지식으로 남기기</button>
        <p class="err" id="e2" hidden></p>
      </div>
    </section>
    <section class="card" aria-label="지식 책장">
      <p class="lb">3 지식 책장 — 작업 <span class="chip" id="ed">1판 1쇄</span></p>
      <div id="bk"></div>
      <div class="row"><span style="color:var(--muted)">자동 생성</span><span>2026-10-14</span></div>
      <div class="row"><span style="color:var(--muted)">사용자 확인</span><span><span id="cf2" class="warn">—</span> <button id="ok" type="button" style="font-size:12px;padding:4px 8px">훑었어요</button></span></div>
    </section>
  </div>
  <p class="note">연결: FR-1·2 단계, FR-6 한곳에서 보기, FR-7 끝남 표시, FR-8 지식 창고. 연결표는 docs/00-overview/migration.md 참고.</p>
</main>
<script>
var TODAY = new Date(2026, 9, 14);
var BUSY = {"2026-10-20": "시험 3개", "2026-10-21": "발표 1개"};
var tasks = [{n: "10문제 3회독", p: "작업", d: "2026-10-15", done: false}];
var book = [{n: "자격증 시험 준비", a: "10문제를 3회독 할 준비를 한다", c: 1}];
var rev = 1, pending = null;
function $(id){return document.getElementById(id);}
function daysLeft(s){var p = s.split("-");return Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - TODAY) / 86400000);}
function say(el, text){el.hidden = !text;el.textContent = text || "";}
function row(label, right){var d = document.createElement("div");d.className = "row";var a = document.createElement("span");a.textContent = label;d.appendChild(a);if (right) d.appendChild(right);return d;}
function render(){
  var ls = $("ls");ls.textContent = "";
  tasks.forEach(function(t, i){
    var r = document.createElement("span"), s = document.createElement("span");
    if (t.done){s.className = "chip";s.textContent = "완료";r.appendChild(s);}
    else{
      var n = daysLeft(t.d);s.className = n <= 1 ? "warn" : "chip";s.textContent = n + "일";r.appendChild(s);
      var b = document.createElement("button");b.type = "button";b.textContent = "완료";b.style.cssText = "font-size:12px;padding:4px 8px;margin-left:6px";
      b.onclick = function(){pending = i;$("lr").hidden = false;$("lw").focus();};r.appendChild(b);
    }
    ls.appendChild(row(t.p + " / " + t.n, r));
  });
  var bk = $("bk");bk.textContent = "";
  book.forEach(function(k){
    var s = document.createElement("span");s.className = "chip";s.textContent = "인용 " + k.c;bk.appendChild(row(k.n, s));
    var sub = document.createElement("div");sub.style.cssText = "font-size:12px;color:var(--muted);padding-bottom:4px";sub.textContent = "행동: " + k.a;bk.appendChild(sub);
  });
  $("ed").textContent = "1판 " + rev + "쇄";
}
$("add").onclick = function(){
  var n = $("nm").value.trim(), d = $("dl").value, e = $("e1"), cf = $("cf");
  if (!n){say(e, "일 이름을 적어 주세요");return;}
  if (!d){say(e, "마감을 골라 주세요");return;}
  say(e, "");
  tasks.push({n: n, p: $("pp").value, d: d, done: false});
  cf.hidden = false;cf.textContent = "";
  var m = BUSY[d], s = document.createElement("span");
  s.className = m ? "warn" : "chip";
  s.textContent = m ? "겹침: 그날 " + m + " — 새 일만 다른 시간으로 제안하고 기존 일정은 그대로" : "겹치는 일정 없음 — 알람 3일·1일·당일 8시";
  cf.appendChild(s);
  $("nm").value = "";
  render();
};
$("sv").onclick = function(){
  var w = $("lw").value.trim(), e = $("e2");
  if (!w){say(e, "배운 것을 적거나 \"미정\"이라고 적어 주세요");return;}
  say(e, "");
  var t = tasks[pending];t.done = true;
  book.push({n: t.n + " — 배운 것", a: w, c: 0});
  rev += 1;pending = null;
  $("lw").value = "";$("lr").hidden = true;$("cf2").textContent = "—";
  render();
};
$("ok").onclick = function(){$("cf2").textContent = "2026-10-14 확인";};
render();
</script>
</body>
</html>
